<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* UX 2026-04-22: Respect iPad/iPhone safe area so the home bar doesn't
         clip the bottom of the sidebar (Sign In button was cut in half). */
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        /* UX 2026-04-22: Match app's dark surface so iPad safe-area strips
           (status bar at top, home indicator at bottom) blend with the UI
           rather than showing the native white root view. */
        background: #0d0f14;
        color-scheme: dark;
        /* UX 2026-05-15: Default body font so content rendered outside the
           app's scoped containers (e.g. popups/menus portaled to <body>)
           never falls back to the browser serif (Times New Roman). */
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #root {
        /* UX 2026-04-22: Apply iPad/iPhone safe-area ONLY on the root
           element so padding isn't tripled across html+body+root. Zero on
           desktop. The app's outer container uses height:100% so it fills
           whatever box is left after the insets are applied. */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
      }
    </style>
    <!-- UX 2026-05-15: JetBrains Mono powers the monospace text in the home
         redesign (timestamps, sizes, codes); without it those fall back to a
         generic monospace that doesn't match the design. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Survey</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
