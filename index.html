<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <style>
      /* UX 2026-04-22: Respect iPad/iPhone safe area so the home bar doesn't
         clip the bottom of the sidebar (Sign In button was cut in half). */
      html, body, #root { height: 100%; }
      /* Owner 2026-10-01 (desktop): a trackpad or wheel scroll over a part
         that cannot scroll (the left rail, a short list) rubber-banded the
         whole page. With a mouse or trackpad the page never bounces and a
         scroll that reaches a list's end stops there. Touch screens keep
         their pull-to-refresh, so this is limited to fine pointers. */
      @media (hover: hover) and (pointer: fine) {
        html, body { overscroll-behavior: none; }
      }
      body {
        margin: 0;
        /* UX 2026-04-22: Match app's dark surface so iPad safe-area strips
           (status bar at top, home indicator at bottom) blend with the UI
           rather than showing the native white root view. */
        background: #0d0f14;
        color-scheme: dark;
        /* UX 2026-05-15: Default body font so content rendered outside the
           app's scoped containers (e.g. popups/menus portaled to <body>)
           never falls back to the browser serif (Times New Roman). */
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #root {
        /* UX 2026-04-22: Apply iPad/iPhone safe-area ONLY on the root
           element so padding isn't tripled across html+body+root. Zero on
           desktop. The app's outer container uses height:100% so it fills
           whatever box is left after the insets are applied. */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
      }
      /* UX 2026-07-12 (mobile demo parity, S1 "one inset owner"): inside the
         native Expo shell the WebView injects --native-safe-area-bottom and the
         shell itself pads the top natively, so #root must NOT also consume the
         raw env() insets — on iOS the bottom inset was counted twice (whole
         viewer floated ~34px too high). Fixed mobile chrome (viewer header,
         dock, sheets, home tab bar) owns its own inset via
         var(--native-safe-area-top/bottom, env(...)) chains. */
      html[data-native-shell] #root {
        padding-top: 0;
        padding-bottom: 0;
      }
      /* iOS zooms the whole WKWebView when a focused field renders below 16px.
         Keep the compact control geometry, but never let the editable glyphs
         cross that native auto-zoom threshold. Scoped to mobile routes/shells
         so desktop and ordinary desktop web rendering remain unchanged. */
      html[data-mobile-viewport="locked"] input:not([type="hidden"]),
      html[data-mobile-viewport="locked"] textarea,
      html[data-mobile-viewport="locked"] select,
      html[data-mobile-viewport="locked"] [contenteditable="true"] {
        font-size: max(16px, 1em) !important;
      }
      /* UX 2026-07-12 (S1, PWA/plain-browser case): when the MOBILE viewer is
         active, its header consumes the top inset and its dock/sheets consume
         the bottom inset, so #root padding would double-count both edges.
         Scoped to <=720px so desktop/iPad rendering is untouched. */
      @media (max-width: 720px) {
        html.survey-viewer-open #root {
          padding-top: 0;
          padding-bottom: 0;
        }
      }
    </style>
    <script>
      /* UX 2026-07-12 (mobile demo parity, S5 first-paint determinism): the
         Expo shell loads the app with ?nativeShell=expo and later injects the
         real safe-area values via WebView JS. Stamp the shell marker + a 10px
         bottom-inset floor synchronously at boot so the FIRST paint already
         lays out shell-style instead of depending on injection timing. The
         shell's injection overwrites the floor with the device's real inset. */
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var nativeShell = params.get('nativeShell');
          var mobileNav = params.get('mobileNav');
          var root = document.documentElement;
          var isMobileViewport = nativeShell === 'expo' || nativeShell === 'capacitor'
            || mobileNav === 'tabs' || mobileNav === 'rail'
            || /^\/mobile(?:\/|$)/.test(window.location.pathname);

          if (isMobileViewport) {
            root.dataset.mobileViewport = 'locked';
            var preventPageZoom = function (event) { event.preventDefault(); };
            document.addEventListener('gesturestart', preventPageZoom, { passive: false });
            document.addEventListener('gesturechange', preventPageZoom, { passive: false });
            document.addEventListener('gestureend', preventPageZoom, { passive: false });
          }

          if (nativeShell === 'expo') {
            root.dataset.nativeShell = 'expo';
            if (!root.style.getPropertyValue('--native-safe-area-bottom')) {
              root.style.setProperty('--native-safe-area-bottom', '10px');
            }
          }
        } catch (e) { /* never block boot on URL parsing */ }
      })();
    </script>
    <!-- UX 2026-05-15: JetBrains Mono powers the monospace text in the home
         redesign (timestamps, sizes, codes); without it those fall back to a
         generic monospace that doesn't match the design. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Survey</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.jsx"></script>
  </body>
</html>
