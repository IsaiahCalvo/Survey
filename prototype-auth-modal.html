<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auth modal — selected</title>
<style>
  :root {
    --bg-page: #06080c;
    --bg-card: #181c24;
    --bg-input: #12151c;
    --border: #2a2f3a;
    --border-soft: rgba(243, 238, 225, 0.12);
    --text: #f3eee1;
    --muted: #a8b0bf;
    --muted-2: #6b7280;
    --accent: #d8a84e;
    --accent-hover: #c89738;
    --accent-ink: #1a1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 32px;
  }
  .modal {
    width: min(100%, 560px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px 28px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
  }
  h2 {
    text-align: center;
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .lead {
    text-align: center;
    margin: 0 0 22px;
    font-size: 13px;
    color: var(--muted);
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    font-family: inherit;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(216, 168, 78, 0.18);
  }
  .btn-primary {
    width: 100%;
    padding: 12px 24px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    height: 42px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 16px 0 12px;
    color: var(--muted-2);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .btn-google-outlined {
    width: 100%;
    margin-top: 10px;
    padding: 12px 24px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 42px;
  }
  .btn-google-outlined:hover {
    background: rgba(243, 238, 225, 0.04);
    border-color: rgba(243, 238, 225, 0.22);
  }
  .btn-google-outlined svg {
    width: 18px;
    height: 18px;
  }
  .footer-link {
    text-align: center;
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--muted);
  }
  .footer-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="modal">
    <h2>Welcome</h2>
    <p class="lead">Sign in to keep going.</p>
    <div class="field">
      <label>Email</label>
      <input type="email" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="••••••••" />
    </div>
    <button class="btn-primary">Sign in</button>
    <div class="divider">or</div>
    <button class="btn-google-outlined">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.5 30 36.5 24 36.5c-6.9 0-12.5-5.6-12.5-12.5S17.1 11.5 24 11.5c3.1 0 6 1.1 8.2 3l6.4-6.4C34.8 4.5 29.7 2.5 24 2.5 12.1 2.5 2.5 12.1 2.5 24S12.1 45.5 24 45.5c11 0 20.5-8 20.5-21.5 0-1.4-.2-2.8-.5-4z"/>
        <path fill="#34A853" d="M6.3 14.7l7 5.1C15.2 16.1 19.3 13 24 13c3.1 0 6 1.1 8.2 3l6.4-6.4C34.8 6 29.7 4 24 4 15.3 4 8.1 9.2 6.3 14.7z" opacity=".9"/>
        <path fill="#FBBC05" d="M24 44c5.6 0 10.6-2.1 14.2-5.7l-6.5-5.3C29.5 34.6 26.9 36 24 36c-5.9 0-10.9-3.9-12.6-9.2l-6.9 5.3C8.1 38.8 15.3 44 24 44z" opacity=".9"/>
        <path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.7 2.1-2 4-3.6 5.5l6.5 5.3C42.7 35.5 45 30.2 45 24c0-1.4-.2-2.8-.5-4z" opacity=".9"/>
      </svg>
      Continue with Google
    </button>
    <div class="footer-link">New here? <a href="#">Create an account</a></div>
  </div>
</body>
</html>
