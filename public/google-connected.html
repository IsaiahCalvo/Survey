<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Google Sheets | Survey</title>
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
/* Survey's own colours (src/styles/tokens.css): the app is dark only. Owner
   2026-11-03: the old "Almost done" page "looks like shit" - a grey box with
   a big code nobody needed. Now it says what is happening, finishes on its
   own, and the code hides behind a small link for the rare case it is needed. */
:root{
  --surface-0:#0d0f14;--surface-1:#171a21;--surface-2:#21252e;--surface-3:#2b303b;
  --border:#404754;--text-1:#dadfe8;--text-2:#b7bec9;--text-3:#959eae;
  --accent:#d8a84e;--accent-light:#edc26d;--accent-press:#b6904a;--accent-text:#15110a;
  --success:#548c71;--danger:#d9534f;--danger-text:#e57f7b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--surface-0);color:var(--text-2);font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:28px 24px 24px;text-align:center;box-shadow:0 12px 28px rgba(0,0,0,.45)}
.marks{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 20px}
.mark{width:44px;height:44px;border-radius:10px;background:var(--surface-1);display:inline-flex;align-items:center;justify-content:center}
.mark svg{width:24px;height:24px}
.join{width:28px;height:2px;border-radius:1px;background:var(--border);position:relative;overflow:hidden}
.join.is-working::after{content:"";position:absolute;inset:0;width:40%;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
.join.is-done{background:var(--success)}
.join.is-failed{background:var(--danger)}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.join.is-working::after{animation:none;width:100%;opacity:.6}}
h1{margin:0 0 6px;font-size:18px;font-weight:600;color:var(--text-1)}
p{margin:0}
#text{color:var(--text-2)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;margin:20px 0 0;padding:0 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);font:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-light);border-color:var(--accent-light)}
.btn:active{background:var(--accent-press);border-color:var(--accent-press)}
.btn:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{margin:18px 0 0;padding:0;border:0;background:none;color:var(--text-3);font:inherit;font-size:12px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.more:hover{color:var(--text-1)}
.codebox{margin:12px 0 0;padding:12px;border-radius:8px;background:var(--surface-1)}
.codebox p{font-size:12px;color:var(--text-3)}
#code{margin:6px 0 0;font:600 22px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--text-1);user-select:all}
.link{margin:8px 0 0;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text-1);word-break:break-all;user-select:all}
.codebox .btn{margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="marks" aria-hidden="true">
    <span class="mark">
      <svg viewBox="0 0 512 512" fill="none" stroke="#d8a84e" stroke-width="52" stroke-linecap="round"><circle cx="256" cy="256" r="230"/><line x1="256" y1="30" x2="256" y2="90"/><line x1="256" y1="482" x2="256" y2="422"/><line x1="30" y1="256" x2="90" y2="256"/><line x1="482" y1="256" x2="422" y2="256"/><line x1="192" y1="200" x2="320" y2="200"/><line x1="192" y1="312" x2="269" y2="312"/></svg>
    </span>
    <span class="join" id="join"></span>
    <span class="mark" id="logoGoogle">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    </span>
    <span class="mark" id="logoMicrosoft" hidden>
      <svg viewBox="0 0 24 24"><path d="M2 2h9.5v9.5H2z" fill="#F25022"/><path d="M12.5 2H22v9.5h-9.5z" fill="#7FBA00"/><path d="M2 12.5h9.5V22H2z" fill="#00A4EF"/><path d="M12.5 12.5H22V22h-9.5z" fill="#FFB900"/></svg>
    </span>
  </div>
  <h1 id="title">Google is connected</h1>
  <p id="text">You can close this tab and go back to Survey.</p>
  <a id="openApp" class="btn" hidden>Open Survey</a>
  <a id="retry" class="btn" hidden>Use another account</a>
  <div id="adminBox" class="codebox" hidden>
    <p>Microsoft said “Need admin approval”? Send this link to your IT admin. They approve Survey once for everyone at your company.</p>
    <p id="adminLink" class="link"></p>
    <button id="copyAdmin" class="btn" type="button">Copy link</button>
  </div>
  <button id="showCode" class="more" type="button" hidden>Using Survey in another browser or on another device?</button>
  <div id="codeBox" class="codebox" hidden>
    <p>Type this code there to finish.</p>
    <p id="code"></p>
  </div>
</main>
<script>
// Google's and Microsoft's consent pages send people here through the
// sheet-sync function (supabase/functions/_shared/sheetSync/service.js,
// oauthCallback and msgraphCallback).
//
// result=finish: the sign-in waits for the Survey account that pressed Connect
// to send back the code in this page's #fragment (service.js claimSignIn).
// It gets back with nothing typed (src/services/sheetSyncClaim.js):
//   * web: the Survey tab that opened this one reads it from localStorage and
//     removes it once used, which this page hears and says "connected";
//   * desktop (&app=desktop): this page is the app's own window; the app reads
//     the code and closes the window (src/electron/sheetSyncConsent.cjs);
//   * phone (&app=phone): "Open Survey" opens the app through its own link
//     scheme with the code (src/mobile/nativeDeepLinks.js).
// Someone who was sent another person's consent link keeps the code here and
// their own Survey account cannot use it, so they are never linked to the sender.
(function () {
  var CLAIM_KEY = 'survey-sheet-sync-claim';
  var params = new URLSearchParams(location.search);
  var result = params.get('result') || 'connected';
  var app = params.get('app');
  var code = (new URLSearchParams(location.hash.replace(/^#/, ''))).get('code') || '';
  if (result === 'finish' && !/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) result = 'failed';
  var ms = params.get('provider') === 'msgraph';
  var provider = ms ? 'msgraph' : 'google';
  var who = ms ? 'Microsoft' : 'Google';
  var $ = function (id) { return document.getElementById(id); };
  var join = $('join');
  if (ms) {
    document.title = 'Microsoft 365 | Survey';
    $('logoGoogle').hidden = true;
    $('logoMicrosoft').hidden = false;
  }
  function say(title, text, state) {
    $('title').textContent = title;
    $('text').textContent = text;
    join.className = 'join' + (state ? ' is-' + state : '');
  }
  var copy = {
    connected: [who + ' is connected', 'You can close this tab and go back to Survey.', 'done'],
    cancelled: [who + ' was not connected', 'You stopped before saying yes. Close this tab and try again from Survey.', 'failed'],
    no_access: [who + ' was not connected', ms
      ? 'Survey needs permission to edit Excel files and to stay signed in. Close this tab and try again. If your company blocks new apps, ask your IT team to allow Survey.'
      : 'Survey needs permission to make and edit its own sheets. Close this tab and try again, and tick the box Google shows.', 'failed'],
    expired: ['That link ran out', 'Close this tab and press Connect ' + who + ' in Survey again.', 'failed'],
    not_configured: ['Not set up yet', (ms ? 'Microsoft 365' : 'Google Sheets') + ' is not set up on this server yet.', 'failed'],
    failed: ['Something went wrong', who + ' did not finish connecting. Close this tab and try again.', 'failed'],
    personal: ['That’s a personal account', 'Live sync needs the work or school Microsoft account your company gives you. Personal accounts (like outlook.com or hotmail.com) can’t sync Excel.', 'failed'],
    admin_approved: ['Survey is approved', 'Everyone at your company can now press Connect Microsoft in Survey. You can close this tab.', 'done'],
    admin_declined: ['Survey was not approved', 'Nothing changed. You can approve it later from the same link.', 'failed']
  };

  // Only Microsoft's own sign-in page, and only Survey's own admin link, may
  // sit behind these buttons: this page is on Survey's site and must never
  // send someone to an address a stranger put in the link.
  function safeUrl(raw, test) {
    try { var u = new URL(raw); return test(u) ? u.href : ''; } catch (e) { return ''; }
  }
  var local = function (u) { return u.protocol === 'http:' && (u.hostname === '127.0.0.1' || u.hostname === 'localhost'); };
  var retry = safeUrl(params.get('retry'), function (u) {
    return (u.protocol === 'https:' && u.hostname === 'login.microsoftonline.com') || local(u);
  });
  var admin = safeUrl(params.get('admin'), function (u) {
    return (u.protocol === 'https:' || local(u)) && /\/functions\/v1\/sheet-sync\/oauth\/msgraph\/admin$/.test(u.pathname);
  });

  if (result !== 'finish') {
    var c = copy[result] || ['Something went wrong', 'Close this tab and try again from Survey.', 'failed'];
    say(c[0], c[1], c[2]);
    if (ms && result === 'personal' && retry) {
      $('retry').href = retry;
      $('retry').hidden = false;
    }
    if (ms && (result === 'cancelled' || result === 'no_access') && admin) {
      $('adminLink').textContent = admin;
      $('adminBox').hidden = false;
      $('copyAdmin').addEventListener('click', function () {
        var shown = function () { $('copyAdmin').textContent = 'Copied'; };
        try { navigator.clipboard.writeText(admin).then(shown, function () { /* the link is selectable */ }); } catch (e) { /* the link is selectable */ }
      });
    }
    if (result === 'admin_approved' || result === 'admin_declined') return;
    if (result === 'connected') {
      try { if (window.opener) window.opener.postMessage({ type: ms ? 'survey-microsoft-connected' : 'survey-google-connected' }, location.origin); } catch (e) { /* the app polls too */ }
      setTimeout(function () { try { window.close(); } catch (e) { /* stays open */ } }, 1500);
    }
    return;
  }

  // ---- finish ----
  try { localStorage.setItem(CLAIM_KEY, JSON.stringify({ provider: provider, code: code, at: Date.now() })); } catch (e) { /* the code below still works */ }
  // Out of the address bar and history once it is saved.
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* stays */ }
  $('code').textContent = code;
  $('showCode').addEventListener('click', function () {
    $('showCode').hidden = true;
    $('codeBox').hidden = false;
  });

  if (app === 'phone') {
    say('Almost there', 'Go back to the Survey app to finish connecting ' + who + '.', 'working');
    var open = $('openApp');
    open.href = 'com.kalvoe.survey://sheet-connected?provider=' + provider + '&code=' + encodeURIComponent(code);
    open.hidden = false;
    $('showCode').hidden = false;
    // Try once on its own; browsers that need a tap get the button.
    setTimeout(function () { try { location.href = open.href; } catch (e) { /* the button stays */ } }, 400);
    return;
  }

  if (app === 'desktop') {
    say('Finishing in Survey', 'This window closes on its own in a moment.', 'working');
    return;
  }

  // Web: the Survey tab claims the code within a couple of seconds and then
  // removes it, which fires a storage event here.
  say('Finishing up', 'Connecting ' + who + ' to your Survey account…', 'working');
  var settled = false;
  function done() {
    if (settled) return;
    settled = true;
    say(who + ' is connected', 'You can close this tab and go back to Survey.', 'done');
    setTimeout(function () { try { window.close(); } catch (e) { /* stays open */ } }, 1500);
  }
  window.addEventListener('storage', function (event) {
    if (event.key === CLAIM_KEY && !event.newValue) done();
  });
  // Also look now and then, for browsers that skip the event.
  var started = Date.now();
  var timer = setInterval(function () {
    var left = null;
    try { left = localStorage.getItem(CLAIM_KEY); } catch (e) { left = 'unknown'; }
    if (!left) { clearInterval(timer); done(); return; }
    if (Date.now() - started > 20000) {
      clearInterval(timer);
      if (settled) return;
      say('Go back to Survey', 'Survey finishes connecting ' + who + ' when you return to it.', 'working');
      $('showCode').hidden = false;
    }
  }, 1000);
})();
</script>
</body>
</html>
