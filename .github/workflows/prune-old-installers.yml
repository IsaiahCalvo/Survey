name: Prune old installers

# Survey's desktop installers sit in the app-public bucket under
# desktop/v<version>/. Only the version the update feeds name is used: apps up
# to 0.1.47 read the old GitHub feed, and 0.1.48 and later read
# desktop/latest.yml and desktop/latest-mac.yml. Each version is about 1.4 GB,
# so older ones only use up the storage budget (KAL-582).
#
# Run by hand. With dry_run (the default) it only lists what it would delete.
# It never touches the feeds, the Android files or the version the feeds name,
# and it stops if the two feeds disagree. Deletes go through the Storage API,
# which removes the bytes (deleting rows with SQL would leave them behind).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: prune-old-installers
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Delete installer folders the feeds no longer name
        shell: bash
        run: |
          set -euo pipefail
          base="https://$SUPABASE_PROJECT_ID.supabase.co/storage/v1"
          feed() { curl --fail --silent --show-error "$base/object/public/app-public/desktop/$1" | sed -n 's/^version: *//p' | tr -d "\"' \r"; }
          win="$(feed latest.yml)"; mac="$(feed latest-mac.yml)"
          echo "Feeds name: Windows $win, Mac $mac"
          [ -n "$win" ] && [ "$win" = "$mac" ] || { echo "The feeds disagree or are empty. Stopping."; exit 1; }
          keep="v$win"

          key="$(curl --fail --silent --show-error -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')"
          [ -n "$key" ] || { echo "No service key from the Management API."; exit 1; }
          echo "::add-mask::$key"
          list() { curl --fail --silent --show-error -X POST "$base/object/list/app-public" \
            -H "Authorization: Bearer $key" -H "apikey: $key" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg p "$1" '{prefix: $p, limit: 1000, offset: 0}')"; }

          # Folders show up with a null id.
          folders="$(list desktop | jq -r '.[] | select(.id == null) | .name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          echo "Version folders: $(echo $folders)"
          echo "$folders" | grep -qx "$keep" || { echo "The folder the feeds name ($keep) is missing. Stopping."; exit 1; }

          paths='[]'
          for folder in $folders; do
            [ "$folder" = "$keep" ] && continue
            files="$(list "desktop/$folder" | jq -c --arg f "desktop/$folder" '[.[] | select(.id != null) | {path: ($f + "/" + .name), size: (.metadata.size // 0)}]')"
            echo "$files" | jq -r '.[] | "  \(.path)  \(.size) bytes"'
            paths="$(jq -c --argjson add "$files" '. + ($add | map(.path))' <<<"$paths")"
          done

          count="$(jq length <<<"$paths")"
          [ "$count" -gt 0 ] || { echo "Nothing to delete."; exit 0; }
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would delete $count files. Run again with dry_run off to delete them."
            exit 0
          fi
          curl --fail --silent --show-error -X DELETE "$base/object/app-public" \
            -H "Authorization: Bearer $key" -H "apikey: $key" -H 'Content-Type: application/json' \
            -d "$(jq -n --argjson p "$paths" '{prefixes: $p}')" | jq -r '.[].name | "deleted \(.)"'
          echo "Deleted $count files."
