name: Daily iOS signed-in walk

# Keep the full walk, but never let a new main build cancel it. An automatic
# failure stays red and can be retried by hand; it must not start a costly
# retry loop on every main CI completion. See docs/CI-COSTS.md.
on:
  workflow_run:
    workflows: ["Build and tests"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-ios-signed-in
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  due:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: due
        run: node scripts/ci-daily-attempt.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  ios-signed-in:
    name: iOS signed-in walk (local Supabase, export to share sheet)
    # Needs Docker for the local Supabase, which GitHub's fast Apple-silicon
    # runners cannot run (no nested VMs), so this uses an Intel runner with
    # Colima and takes ~2h. Too slow to gate every PR: nightly + manual only.
    needs: due
    if: needs.due.outputs.run == 'true'
    # Intel runner: the local Supabase needs Docker, which runs here through
    # Colima; Apple-silicon runners cannot nest a VM for it.
    runs-on: macos-15-intel
    timeout-minutes: 200
    env:
      OUT: ${{ github.workspace }}/ios-flow-out
      DEVICE: iPhone 16
      BUNDLE_ID: com.kalvoe.survey
      # The Intel runner also hosts the Colima VM, so Maestro's iOS driver
      # starts slowly; its default wait is too short there.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '900000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Start Docker (Colima)
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 7 --disk 40
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      # The Colima VM is slow: realtime never passes its health check there
      # (the walk does not need it), and storage can miss the first one.
      - name: Start the local Supabase
        run: npm run e2e:stack:up || { sleep 30; npm run e2e:stack:up; }
        env:
          E2E_REALTIME: 'off'
          E2E_EDGE_RUNTIME: 'off'
          E2E_IGNORE_HEALTH: '1'
      - name: Build web bundle against the local stack
        run: npx vite build --mode e2e
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      # WKWebView can't serve the app over http, and from capacitor:// the
      # local Supabase's plain-http calls are blocked as mixed content (the
      # sign-in error "{}"; native HTTP didn't cover auth). So load the app
      # from a local http server instead, the same way dev live reload does.
      - name: Serve the bundle over local http and point the app at it
        run: |
          nohup npx vite preview --mode e2e --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:4173/ >/dev/null
          CAPACITOR_SERVER_URL=http://127.0.0.1:4173 npx cap sync ios
      - name: Build app for the simulator
        run: |
          mkdir -p "$OUT"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$OUT/xcodebuild.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          test "${PIPESTATUS[0]}" = 0
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Boot only after the local stack is up: booting alongside Colima starved
      # both on this 4-core runner (the stack missed its health checks).
      - name: Boot the simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const all=Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,l])=>l);
            const m=all.reverse().find(x=>x.name===process.env.DEVICE)||all.find(x=>x.name.startsWith("iPhone"));
            console.log(m.udid)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(find build/ios/Build/Products -maxdepth 2 -name 'App.app' | head -1)"
          # Warm the first launch here (it can take many minutes on this runner)
          # so Maestro's launchApp doesn't hang on it.
          xcrun simctl launch "$UDID" com.kalvoe.survey
          sleep 90
          xcrun simctl terminate "$UDID" com.kalvoe.survey || true
      # Sign-in showed "{}" (auth-js's message for a 502/503 from the API
      # gateway): the auth container can die on this slow VM after seeding.
      # Prove a real password sign-in works first; restart auth if not.
      - name: Check sign-in against the local stack
        run: |
          set -a; . ./.env.e2e; set +a
          try() { curl -sf -m 30 -X POST "$VITE_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"email":"e2e-owner@example.com","password":"E2e-local-only-123!"}' -o /dev/null; }
          for i in 1 2 3 4 5 6; do try && { echo "sign-in OK"; exit 0; }
            docker ps -a --format '{{.Names}} {{.Status}}' | tee -a "$OUT/docker-ps.txt"
            docker ps -a --format '{{.Names}}' | grep -E 'auth|kong' | xargs -n1 docker restart; sleep 30; done
          docker ps -a --format '{{.Names}}' | grep auth | xargs -n1 docker logs --tail 200 > "$OUT/auth.log" 2>&1
          echo "::error::password sign-in against the local stack keeps failing"; exit 1
      - name: Walk the app (signed in, Counter after Arrow, export)
        # The XCTest driver sometimes misses its start window on this slow
        # runner (twice on 2026-10-22, before any flow step); try once more.
        run: |
          set -o pipefail
          m() { maestro --device "$UDID" test --format junit --output "$OUT/report.xml" --test-output-dir "$OUT" .github/native-flows/ios-signed-in.yaml 2>&1 | tee "$OUT/maestro-run.log"; }
          m || { grep -q 'driver not ready in time' "$OUT/maestro-run.log" && m; }
      - name: Relaunch with the API stopped (offline)
        run: |
          docker ps -q | xargs docker pause
          maestro --device "$UDID" test --format junit --output "$OUT/report-offline.xml" --test-output-dir "$OUT" .github/native-flows/ios-offline-relaunch.yaml
      - name: Save logs
        if: always()
        run: xcrun simctl spawn booted log show --last 10m --predicate 'process == "App"' > "$OUT/app.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-signed-in-results
          path: ios-flow-out
          retention-days: 7
