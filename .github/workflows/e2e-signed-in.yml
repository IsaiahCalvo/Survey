name: Signed-in E2E

# Real sign-in end-to-end suite (tests/e2e-signed-in/) against a throwaway local
# Supabase stack: every migration replayed from the repo, seeded test accounts,
# the app served by Vite. How-to: docs/E2E-SIGNED-IN.md.
#
# INFORMATIONAL ONLY. Nothing depends on this workflow: deploy-production.yml
# keys off "Build and tests" (ci.yml) by name, and this job must never be made a
# required check without the owner's say-so.
#
# Speed: the specs run one at a time against one database, so a single
# machine took ~31 minutes. They now run split across the shard machines at
# once (scripts/e2e-signed-in-shard.mjs balances them by the measured seconds
# in tests/e2e-signed-in/spec-seconds.json), each with its own throwaway
# stack, so shards never share data. The repo is public, so these standard
# runners cost nothing; each run holds one job slot per shard for ~8 minutes.
# It still skips Dependabot and drafts, runs only when a pull request touches
# something the suite exercises, and cancels superseded runs.

on:
  workflow_dispatch:
    inputs:
      perf:
        description: 'Run the big-drawing-set profilers (scripts/perf) instead of the suite'
        type: boolean
        default: false
      perf_pages:
        description: 'Sheets in the seeded big drawing set (perf runs only)'
        default: '240'
      perf_base:
        description: 'Also profile this git ref (branch or sha) on the same runner, for a before/after (perf runs only)'
        default: ''
      perf_sheet_kb:
        description: 'KB of raster per seeded sheet, for a realistic file size (perf runs only; 0 = vector only, ~0.8 MB)'
        default: '0'
      perf_net:
        description: 'Throttle the profiled page, <latency ms>/<down Mbps>, e.g. 150/9 (perf runs only)'
        default: ''
      perf_flags:
        description: 'Feature flags to turn on for the perf run, comma-separated (perf runs only)'
        default: ''
      perf_markups:
        description: 'Markups in the seeded set, and optionally the sheets they sit on, <count>[/<sheets>], e.g. 20000/30 (perf runs only)'
        default: '4000'
      perf_suite:
        description: 'Which profilers to run, comma-separated: open, link (share-link open), memory, profile (perf runs only)'
        default: 'open,memory,profile'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'scripts/e2e-local-supabase.mjs'
      - 'scripts/e2e-fake-groq.mjs'
      - 'tests/e2e-signed-in/**'
      - 'playwright.e2e-signed-in.config.mjs'
      - 'tests/e2e-speed/**'
      - 'playwright.speed.config.mjs'
      - 'scripts/perf/big-doc-seed.mjs'
      - 'vite.config.js'
      - 'viteEnvConfig.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-signed-in.yml'

concurrency:
  group: e2e-signed-in-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  signed-in-e2e:
    name: Signed-in E2E (local Supabase) ${{ inputs.perf && 'perf' || format('{0}/{1}', matrix.shard, strategy.job-total) }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft == false
          && github.triggering_actor != 'dependabot[bot]')
    # Playwright 1.59 has no browsers for ubuntu-26.04, which ubuntu-latest
    # became in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.perf && 55 || 20 }}
    strategy:
      # Let every shard finish so one run shows all failures, not just the first.
      fail-fast: false
      matrix:
        shard: ${{ inputs.perf && fromJSON('[1]') || fromJSON('[1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0

      # Chromium installs while the stack pulls its images, instead of before.
      - name: Start local Supabase, seed test accounts, install Chromium
        run: |
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1 &
          chromium=$!
          npm run e2e:stack:up
          wait "$chromium" || { cat "$RUNNER_TEMP/chromium-install.log"; exit 1; }
        env:
          # Pull the Supabase images straight from GitHub's registry. The CLI
          # tries public.ecr.aws first, which keeps refusing with "Data limit
          # exceeded" and costs ~15 s per machine before it falls back.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

      - name: Run signed-in E2E suite (shard ${{ matrix.shard }})
        if: ${{ !inputs.perf }}
        run: |
          specs="$(node scripts/e2e-signed-in-shard.mjs "$SHARD" "$SHARDS")"
          echo "$specs" | tr ' ' '\n'
          # Word splitting is wanted: one argument per spec path.
          npm run test:e2e:signed-in -- $specs
        env:
          CI: '1'
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}

      # Times Home and the first page on a production build; fails on a big
      # slowdown (budgets in tests/e2e-speed/budget.mjs, times on the summary).
      # Shard 1 only; the split gives that shard less of the suite to make room.
      - name: Speed budget (production build)
        if: ${{ !inputs.perf && matrix.shard == 1 && (success() || failure()) }}
        run: npm run test:e2e:speed
        env:
          CI: '1'

      # Manual perf run: open time, pan/zoom smoothness and memory on the big
      # drawing set (scripts/perf/big-doc-open.mjs, big-doc-memory.mjs).
      - name: Big drawing set profilers
        if: ${{ inputs.perf }}
        env:
          BIG_DOC_PAGES: ${{ inputs.perf_pages }}
          BIG_DOC_SHEET_KB: ${{ inputs.perf_sheet_kb }}
          NET: ${{ inputs.perf_net }}
          FLAGS: ${{ inputs.perf_flags }}
          PERF_BASE: ${{ inputs.perf_base }}
          PERF_SUITE: ${{ inputs.perf_suite }}
          PERF_MARKUPS: ${{ inputs.perf_markups }}
          BASE: http://127.0.0.1:5241
        run: |
          node scripts/e2e-local-supabase.mjs seed
          export BIG_DOC_MARKUPS="${PERF_MARKUPS%%/*}"
          if [[ "$PERF_MARKUPS" == */* ]]; then export BIG_DOC_HOT_PAGES="${PERF_MARKUPS##*/}"; fi
          node scripts/perf/big-doc-seed.mjs
          mkdir -p perf-out
          want() { [[ ",${PERF_SUITE:-open,memory,profile}," == *",$1,"* ]]; }
          # Runners differ by up to ~40% in open time, so a before/after is
          # only meaningful from one runner: profile the base ref first.
          if [ -n "$PERF_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$PERF_BASE"
            git worktree add --detach "$RUNNER_TEMP/perf-base" FETCH_HEAD
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/perf-base/node_modules"
            cp .env.e2e "$RUNNER_TEMP/perf-base/.env.e2e"
            (cd "$RUNNER_TEMP/perf-base" && npx vite build --mode e2e --outDir "$PWD/dist-base")
            (npx vite preview --mode e2e --outDir "$RUNNER_TEMP/perf-base/dist-base" --host 127.0.0.1 --port 5242 --strictPort &)
            npx wait-on -t 60000 http://127.0.0.1:5242
            if want open; then BASE=http://127.0.0.1:5242 RUNS=3 SIZES=desktop,phone node scripts/perf/big-doc-open.mjs | tee perf-out/base-open.txt; fi
            if want link; then BASE=http://127.0.0.1:5242 RUNS=3 SIZES=desktop,phone LINK=1 node scripts/perf/big-doc-open.mjs | tee perf-out/base-link.txt; fi
            if want memory; then BASE=http://127.0.0.1:5242 RUNS=3 SIZES=phone,tablet,desktop node scripts/perf/big-doc-memory.mjs | tee perf-out/base-memory.txt; fi
          fi
          npx vite build --mode e2e --outDir dist-perf --sourcemap
          (npx vite preview --mode e2e --outDir dist-perf --host 127.0.0.1 --port 5241 --strictPort &)
          npx wait-on -t 60000 http://127.0.0.1:5241
          if want open; then RUNS=3 SIZES=desktop,phone node scripts/perf/big-doc-open.mjs | tee perf-out/open.txt; fi
          if want link; then RUNS=3 SIZES=desktop,phone LINK=1 node scripts/perf/big-doc-open.mjs | tee perf-out/link.txt; fi
          if want memory; then RUNS=3 SIZES=phone,tablet,desktop HEAP_TOP=40 ZOOM_PROFILE=perf-out/zoom OUT=perf-out/memory.json node scripts/perf/big-doc-memory.mjs | tee perf-out/memory.txt; fi
          if want profile; then PROFILE=perf-out/open SIZES=phone,tablet node scripts/perf/big-doc-open.mjs || true; fi
          for f in perf-out/*.cpuprofile; do echo "== $f"; DIST=dist-perf TOP=40 node scripts/perf/cpuprofile-top.mjs "$f" || true; done
          { echo '### Big drawing set'; echo '```'; grep MEDIANS perf-out/*.txt 2>/dev/null || echo 'no timing suites in this run'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload perf results
        if: ${{ inputs.perf && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: big-doc-perf
          path: perf-out/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-signed-in-report-${{ matrix.shard }}
          path: |
            playwright-report-e2e/
            test-results/e2e-signed-in/
            test-results/e2e-speed/
          retention-days: 7

      # A test that failed once and passed on retry still leaves its trace in
      # test-results; keep it so a flaky test can be looked at. Nothing is
      # uploaded when every test passed first time.
      - name: Upload traces of flaky tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-signed-in-flaky-${{ matrix.shard }}
          path: test-results/e2e-signed-in/
          if-no-files-found: ignore
          retention-days: 7

      # No stack teardown: the runner is thrown away with the job, and stopping
      # the containers only added ~20 s to every shard.

  # One check to read for the whole suite: green only when every shard passed.
  signed-in-e2e-result:
    name: Signed-in E2E
    needs: signed-in-e2e
    if: ${{ always() && needs.signed-in-e2e.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every shard passed
        run: |
          echo "Shards: ${{ needs.signed-in-e2e.result }}"
          test "${{ needs.signed-in-e2e.result }}" = success
