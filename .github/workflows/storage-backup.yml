name: Storage backup

# Once a week, copies every stored file (PDFs, survey photos/video/audio, brand
# art) into the private storage-backup bucket; Supabase's daily backups cover
# the database only. Copies are server side, so nothing leaves Supabase.
# Switched off until the repo variable STORAGE_BACKUP_ENABLED is 'true'.
# How it works and what it costs: scripts/storage-backup.mjs and the
# "Storage backup" section of docs/ROLLBACK.md. The repo is public, so the log
# shows counts only. On failure it raises one `alert` issue; the next good run
# closes it.

on:
  schedule:
    - cron: '10 9 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.STORAGE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # The service-role key comes from the Management API at run time, so the
      # repo holds no extra secret.
      - name: Copy new and changed files
        id: backup
        continue-on-error: true
        shell: bash
        run: |
          key="$(curl --fail --silent --show-error -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret") | .api_key][0] // empty')"
          [ -n "$key" ] || { echo "No service key from the Management API."; exit 1; }
          echo "::add-mask::$key"
          SUPABASE_URL="https://$SUPABASE_PROJECT_ID.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$key" \
            node scripts/storage-backup.mjs 2>&1 | tee backup.log
          exit "${PIPESTATUS[0]}"

      - name: Raise or clear the backup issue
        if: always()
        shell: bash
        env:
          BACKUP: ${{ steps.backup.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Alert: storage backup failed"
          gh label create alert --color B60205 --description "Production monitor" 2>/dev/null || true
          open="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ "$BACKUP" != success ]; then
            body="$(printf 'The weekly copy of stored files did not finish:\n```\n%s\n```\n\nRun: %s' "$(grep '\[storage-backup\]' backup.log 2>/dev/null | tail -n 5)" "$RUN_URL")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --label alert --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Backup finished at $(date -u +%FT%TZ)."
          fi
