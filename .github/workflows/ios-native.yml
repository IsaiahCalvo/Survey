name: Native app check (iOS + Android)

# Builds the real Capacitor iOS app (not Safari / Expo Go - that is
# ios-sim.yml) on a GitHub macOS runner, installs it in an iPhone simulator,
# launches it and checks it stays up. So native changes can be tested without
# the owner's Mac. Screenshots and logs are uploaded as the run artifact.
#
# Runs on any PR that can change the native app (web UI included: the app
# ships the same bundle), plus manual runs. The repo is public, so macOS
# runner minutes are free.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-native.yml'
      - '.github/native-flows/**'
  workflow_dispatch:
  # The iOS signed-in walk is too slow for every PR (see that job); it runs
  # nightly and on demand instead.
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  native:
    name: Build and launch iOS app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/ios-native-out
      DEVICE: iPhone 16
      BUNDLE_ID: com.kalvoe.survey
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync ios
      - name: Build app for the simulator
        run: |
          mkdir -p "$OUT"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$OUT/xcodebuild.log" | grep -E "error:|warning: .*Info.plist|BUILD (SUCCEEDED|FAILED)"
          test "${PIPESTATUS[0]}" = 0
      - name: Check the built app
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 2 -name 'App.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          for k in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" >/dev/null || { echo "::error::missing $k"; exit 1; }
          done
          # Native plugins the web code calls must be registered in the shell.
          for p in FilesystemPlugin SharePlugin; do
            grep -q "$p" "$APP/capacitor.config.json" || { echo "::error::$p not registered"; exit 1; }
          done
      - name: Install, launch and stay up
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const all=Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,l])=>l);
            const m=all.reverse().find(x=>x.name===process.env.DEVICE)||all.find(x=>x.name.startsWith("iPhone"));
            console.log(m.udid)')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          for t in 10 25 45; do
            sleep $((t - ${prev:-0})); prev=$t
            xcrun simctl io "$UDID" screenshot "$OUT/launch-${t}s.png"
          done
          # Simulator apps run as ordinary host processes, so look for it there
          # (launchctl inside the simulator was unreliable).
          if ! pgrep -f "App.app/App" >/dev/null; then
            echo "::error::the app is no longer running 45s after launch"
            exit 1
          fi
          echo "App still running after 45s."
      - name: Save logs
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 5m --predicate 'process == "App"' > "$OUT/app.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-results
          path: ios-native-out
          retention-days: 7

  android:
    name: Build and launch Android app (Pixel emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/android-native-out
      APP_ID: com.kalvoe.survey
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install, launch and stay up on a Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain AOSP image: on google_apis, Play services sometimes dies during
          # boot and Android kills our app with it (it holds the Play fonts
          # provider the web view uses). Not something users hit.
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            mkdir -p "$OUT"
            # A slow CI emulator pops "Pixel Launcher isn't responding" and
            # monkey can abort with 0 events, so start the activity directly
            # and retry until the process exists.
            adb shell settings put global hide_error_dialogs 1
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # The runner runs each script line on its own, so keep the loop on one line.
            for i in 1 2 3 4 5; do adb shell am start -W -n "$APP_ID/.MainActivity" || true; sleep 5; adb shell pidof "$APP_ID" && break; done
            sleep 10; adb exec-out screencap -p > "$OUT/launch-10s.png"
            sleep 15; adb exec-out screencap -p > "$OUT/launch-25s.png"
            sleep 20; adb exec-out screencap -p > "$OUT/launch-45s.png"
            adb logcat -d > "$OUT/logcat.txt" || true
            adb shell pidof "$APP_ID" || { grep -E "AndroidRuntime|FATAL|ActivityManager.*(survey|Killing)|lowmemorykiller|chromium.*(crash|Renderer)" "$OUT/logcat.txt" | tail -40; echo "::error::the app is no longer running 45s after launch"; exit 1; }
            echo "App still running after 45s."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-results
          path: android-native-out
          retention-days: 7

  android-signed-in:
    name: Android signed-in walk (local Supabase, export to share sheet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/android-flow-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Throwaway local Supabase with seeded accounts; writes .env.e2e.
      - run: npm run e2e:stack:up
      # --mode e2e reads .env.e2e: local API URL and no captcha. The emulator
      # reaches the host's 127.0.0.1 through `adb reverse` below.
      - name: Build web bundle against the local stack
        run: npx vite build --mode e2e
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npx cap sync android
        env:
          CAPACITOR_E2E_LOCAL_HTTP: '1'
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Walk the app on a Pixel emulator
        # A lost emulator leaves adb on "waiting for device"; fail fast instead
        # of using the job's whole hour (the steps above take ~20 min).
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain AOSP image: on google_apis, Play services sometimes dies during
          # boot and Android kills our app with it (it holds the Play fonts
          # provider the web view uses). Not something users hit.
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            mkdir -p "$OUT"
            adb reverse tcp:54421 tcp:54421
            # A slow CI emulator pops "Pixel Launcher isn't responding" over the app.
            adb shell settings put global hide_error_dialogs 1
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output "$OUT/report.xml" --test-output-dir "$OUT" .github/native-flows/android-signed-in.yaml || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            timeout 300 bash .github/native-flows/android-pen-mode.sh "$OUT" || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            timeout 300 bash .github/native-flows/android-counter-after-arrow.sh "$OUT" || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            timeout 300 bash .github/native-flows/android-delete-point.sh "$OUT" || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            timeout 300 bash .github/native-flows/android-voice-mic.sh "$OUT" || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            timeout 300 bash .github/native-flows/android-undo-toast-check.sh "$OUT" || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            maestro test --format junit --output "$OUT/report-editor.xml" --test-output-dir "$OUT" .github/native-flows/android-editor-project-menu.yaml || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
            adb reverse --remove-all
            maestro test --format junit --output "$OUT/report-offline.xml" --test-output-dir "$OUT" .github/native-flows/android-offline-relaunch.yaml || { timeout 30 adb logcat -d > "$OUT/logcat.txt"; exit 1; }
      # The emulator has twice died mid-walk (adb: port 5554 refused). Record
      # whether the host's out-of-memory killer took it.
      - name: Host memory check
        if: failure()
        run: |
          free -m
          sudo dmesg | grep -iE "out of memory|killed process|oom" | tail -20 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-signed-in-results
          path: android-flow-out
          retention-days: 7

  ios-signed-in:
    name: iOS signed-in walk (local Supabase, export to share sheet)
    # Needs Docker for the local Supabase, which GitHub's fast Apple-silicon
    # runners cannot run (no nested VMs), so this uses an Intel runner with
    # Colima and takes ~2h. Too slow to gate every PR: nightly + manual only.
    if: github.event_name != 'pull_request'
    # Intel runner: the local Supabase needs Docker, which runs here through
    # Colima; Apple-silicon runners cannot nest a VM for it.
    runs-on: macos-15-intel
    timeout-minutes: 200
    env:
      OUT: ${{ github.workspace }}/ios-flow-out
      DEVICE: iPhone 16
      BUNDLE_ID: com.kalvoe.survey
      # The Intel runner also hosts the Colima VM, so Maestro's iOS driver
      # starts slowly; its default wait is too short there.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Start Docker (Colima)
        run: |
          brew install colima docker
          colima start --cpu 4 --memory 10 --disk 40
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> "$GITHUB_ENV"
      # The Colima VM is slow: realtime never passes its health check there
      # (the walk does not need it), and storage can miss the first one.
      - name: Start the local Supabase
        run: npm run e2e:stack:up || { sleep 30; npm run e2e:stack:up; }
        env:
          E2E_REALTIME: 'off'
      - name: Build web bundle against the local stack
        run: npx vite build --mode e2e
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npx cap sync ios
      - name: Build app for the simulator
        run: |
          mkdir -p "$OUT"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$OUT/xcodebuild.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          test "${PIPESTATUS[0]}" = 0
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # Boot only after the local stack is up: booting alongside Colima starved
      # both on this 4-core runner (the stack missed its health checks).
      - name: Boot the simulator and install the app
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const all=Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,l])=>l);
            const m=all.reverse().find(x=>x.name===process.env.DEVICE)||all.find(x=>x.name.startsWith("iPhone"));
            console.log(m.udid)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$(find build/ios/Build/Products -maxdepth 2 -name 'App.app' | head -1)"
      - name: Walk the app (signed in, Counter after Arrow, export)
        run: maestro --device "$UDID" test --format junit --output "$OUT/report.xml" --test-output-dir "$OUT" .github/native-flows/ios-signed-in.yaml
      - name: Relaunch with the API stopped (offline)
        run: |
          docker ps -q | xargs docker pause
          maestro --device "$UDID" test --format junit --output "$OUT/report-offline.xml" --test-output-dir "$OUT" .github/native-flows/ios-offline-relaunch.yaml
      - name: Save logs
        if: always()
        run: xcrun simctl spawn booted log show --last 10m --predicate 'process == "App"' > "$OUT/app.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-signed-in-results
          path: ios-flow-out
          retention-days: 7
