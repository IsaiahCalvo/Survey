name: Native app check (iOS + Android)

# Builds the real Capacitor iOS app (not Safari / Expo Go - that is
# ios-sim.yml) on a GitHub macOS runner, installs it in an iPhone simulator,
# launches it and checks it stays up. So native changes can be tested without
# the owner's Mac. Screenshots and logs are uploaded as the run artifact.
#
# Runs on any PR that can change the native app (web UI included: the app
# ships the same bundle), once ready for review, plus manual runs.
# The slow daily walk lives in ios-signed-in.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ios/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-native.yml'
      - 'scripts/ci-followup-plan.mjs'
      - 'scripts/ci-daily-attempt.mjs'
      - '.github/native-flows/**'
  workflow_run:
    workflows: ["Build and tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      full_walk:
        description: Also run the slow daily iOS signed-in walk
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    # Same-repo PR events wait for CI without allocating a runner. Forks must
    # stay on pull_request: never execute their code in workflow_run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch != 'main' &&
       (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.plan.outputs.run }}
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      ref: ${{ steps.plan.outputs.ref }}
      head: ${{ steps.plan.outputs.head }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      # workflow_run checks out trusted default-branch code, never PR code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: plan
        run: node scripts/ci-followup-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOWUP_SUITE: native

  start-pr:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Use the normal check on direct PR and manual runs
        if: github.event_name != 'workflow_run'
        run: echo 'This run reports its normal Actions checks.'
      - uses: actions/github-script@v9
        if: github.event_name == 'workflow_run'
        env:
          PR: ${{ needs.plan.outputs.pr }}
          HEAD: ${{ needs.plan.outputs.head }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR) });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD) {
              core.setFailed('PR is closed or has a newer head.');
              return;
            }
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.HEAD, state: 'pending',
              context: 'Native app check', description: 'Running checks after core CI',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

  native:
    needs: [plan, start-pr]
    if: needs.plan.outputs.ios == 'true'
    permissions:
      contents: read
    concurrency:
      group: native-native-${{ needs.plan.outputs.pr || github.ref }}
      cancel-in-progress: true
    name: Build and launch iOS app
    runs-on: macos-26
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/ios-native-out
      DEVICE: iPhone 16
      BUNDLE_ID: com.kalvoe.survey
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync ios
      - name: Build app for the simulator
        run: |
          mkdir -p "$OUT"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$OUT/xcodebuild.log" | grep -E "error:|warning: .*Info.plist|BUILD (SUCCEEDED|FAILED)"
          test "${PIPESTATUS[0]}" = 0
      - name: Check the built app
        run: |
          APP=$(find build/ios/Build/Products -maxdepth 2 -name 'App.app' | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          for k in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            /usr/libexec/PlistBuddy -c "Print :$k" "$APP/Info.plist" >/dev/null || { echo "::error::missing $k"; exit 1; }
          done
          # Native plugins the web code calls must be registered in the shell.
          for p in FilesystemPlugin SharePlugin; do
            grep -q "$p" "$APP/capacitor.config.json" || { echo "::error::$p not registered"; exit 1; }
          done
      - name: Install, launch and stay up
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0)).devices;
            const all=Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,l])=>l);
            const m=all.reverse().find(x=>x.name===process.env.DEVICE)||all.find(x=>x.name.startsWith("iPhone"));
            console.log(m.udid)')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          for t in 10 25 45; do
            sleep $((t - ${prev:-0})); prev=$t
            xcrun simctl io "$UDID" screenshot "$OUT/launch-${t}s.png"
          done
          # Simulator apps run as ordinary host processes, so look for it there
          # (launchctl inside the simulator was unreliable).
          if ! pgrep -f "App.app/App" >/dev/null; then
            echo "::error::the app is no longer running 45s after launch"
            exit 1
          fi
          echo "App still running after 45s."
      - name: Save logs
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 5m --predicate 'process == "App"' > "$OUT/app.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-native-results
          path: ios-native-out
          # Keep passing screenshots briefly; retain failure evidence a week.
          retention-days: ${{ job.status == 'success' && 1 || 7 }}

  android:
    needs: [plan, start-pr]
    if: needs.plan.outputs.android == 'true'
    permissions:
      contents: read
    concurrency:
      group: native-android-${{ needs.plan.outputs.pr || github.ref }}
      cancel-in-progress: true
    name: Build and launch Android app (Pixel emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/android-native-out
      APP_ID: com.kalvoe.survey
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Install, launch and stay up on a Pixel emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          # Plain AOSP image: on google_apis, Play services sometimes dies during
          # boot and Android kills our app with it (it holds the Play fonts
          # provider the web view uses). Not something users hit.
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            mkdir -p "$OUT"
            # A slow CI emulator pops "Pixel Launcher isn't responding" and
            # monkey can abort with 0 events, so start the activity directly
            # and retry until the process exists.
            adb shell settings put global hide_error_dialogs 1
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            # The runner runs each script line on its own, so keep the loop on one line.
            for i in 1 2 3 4 5; do adb shell am start -W -n "$APP_ID/.MainActivity" || true; sleep 5; adb shell pidof "$APP_ID" && break; done
            sleep 10; adb exec-out screencap -p > "$OUT/launch-10s.png"
            sleep 15; adb exec-out screencap -p > "$OUT/launch-25s.png"
            sleep 20; adb exec-out screencap -p > "$OUT/launch-45s.png"
            adb logcat -d > "$OUT/logcat.txt" || true
            adb shell pidof "$APP_ID" || { grep -E "AndroidRuntime|FATAL|ActivityManager.*(survey|Killing)|lowmemorykiller|chromium.*(crash|Renderer)" "$OUT/logcat.txt" | tail -40; echo "::error::the app is no longer running 45s after launch"; exit 1; }
            echo "App still running after 45s."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-native-results
          path: android-native-out
          # Keep passing screenshots briefly; retain failure evidence a week.
          retention-days: ${{ job.status == 'success' && 1 || 7 }}

  android-signed-in:
    needs: [plan, start-pr]
    if: needs.plan.outputs.android == 'true'
    permissions:
      contents: read
    concurrency:
      group: native-android-signed-in-${{ needs.plan.outputs.pr || github.ref }}
      cancel-in-progress: true
    name: Android signed-in walk (local Supabase, export to share sheet)
    runs-on: ubuntu-latest
    # ~20 min of setup, then up to two walks (the second only after an emulator crash).
    timeout-minutes: 80
    env:
      OUT: ${{ github.workspace }}/android-flow-out
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      # Throwaway local Supabase with seeded accounts; writes .env.e2e.
      - run: npm run e2e:stack:up
      # --mode e2e reads .env.e2e: local API URL and no captcha. The emulator
      # reaches the host's 127.0.0.1 through `adb reverse` below.
      - name: Build web bundle against the local stack
        run: npx vite build --mode e2e
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - run: npx cap sync android
        env:
          CAPACITOR_E2E_LOCAL_HTTP: '1'
      - run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      # The CI emulator process sometimes dies mid-walk (adb "error: closed",
      # then port 5554 refused) with plenty of host memory left, and the SDK
      # download now and then fails ("Error reading Zip content") before the
      # emulator starts. The walk script marks the first case (emulator-lost)
      # and its own start (walk-started); only in those two cases is the walk
      # run once more on a fresh emulator. A failed check on a live emulator is
      # not retried.
      - name: Walk the app on a Pixel emulator
        id: walk
        continue-on-error: true
        # A lost emulator leaves adb on "waiting for device"; fail fast instead
        # of using the job's whole budget.
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          # Plain AOSP image: on google_apis, Play services sometimes dies during
          # boot and Android kills our app with it (it holds the Play fonts
          # provider the web view uses). Not something users hit.
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # swangle (ANGLE on SwiftShader Vulkan): the default swiftshader_indirect
          # crashed the emulator in about a third of walks; swangle ran 12 of 12
          # clean in side-by-side runs (PR #1336).
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/native-flows/android-signed-in-walk.sh "$OUT"
      - name: Reseed after a lost emulator or a failed emulator setup
        id: reseed
        if: steps.walk.outcome == 'failure' && (hashFiles('android-flow-out/emulator-lost') != '' || hashFiles('android-flow-out/walk-started') == '')
        run: npm run e2e:seed
      - name: Walk again on a fresh emulator (the first one crashed)
        id: walk2
        if: steps.reseed.outcome == 'success'
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          # Plain AOSP image: on google_apis, Play services sometimes dies during
          # boot and Android kills our app with it (it holds the Play fonts
          # provider the web view uses). Not something users hit.
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/native-flows/android-signed-in-walk.sh "$OUT/retry"
      - name: Host memory and emulator crash files
        if: steps.walk.outcome == 'failure'
        run: |
          free -m
          sudo dmesg | grep -iE "out of memory|killed process|oom" | tail -20 || true
          cp -r /tmp/android-runner "$OUT/emu-crash" 2>/dev/null || true
      - name: Fail unless a walk passed
        if: steps.walk.outcome == 'failure' && steps.walk2.outcome != 'success'
        run: |
          echo "::error::the Android signed-in walk failed (see the walk steps above)"
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-signed-in-results
          path: android-flow-out
          # Keep passing screenshots briefly; retain failure evidence a week.
          retention-days: ${{ job.status == 'success' && 1 || 7 }}

  daily-walk:
    if: github.event_name == 'workflow_dispatch' && inputs.full_walk
    uses: ./.github/workflows/ios-signed-in.yml

  report-pr:
    name: Report native result on PR
    needs: [plan, native, android, android-signed-in]
    if: always() && github.event_name == 'workflow_run' && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const { followupState } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-followup-plan.mjs`);
            const needs = JSON.parse(process.env.NEEDS);
            const plan = needs.plan.outputs;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(plan.pr) });
            if (pr.state !== 'open' || pr.head.sha !== plan.head) {
              core.info('PR is closed or has a newer head; leave its status alone.');
              return;
            }
            const results = [];
            if (plan.ios === 'true') results.push(needs.native.result);
            if (plan.android === 'true') results.push(needs.android.result, needs['android-signed-in'].result);
            const state = followupState(results);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: plan.head, state,
              context: 'Native app check', description: 'Native checks after core CI',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            if (state !== 'success') core.setFailed(`Suite results: ${results.join(', ')}`);
