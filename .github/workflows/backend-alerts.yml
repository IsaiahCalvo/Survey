name: Backend alerts

# Every hour, reads production's Supabase logs (scripts/backend-alerts.mjs) and
# raises one `alert` issue when:
#   - failed sign-ins pass 30 in an hour (password guessing),
#   - edge functions answer 5 or more server errors in an hour,
#   - the voice agent nears Groq's free 1,000 requests a day (800 in 24 hours),
#   - a crash from the web app or the phone apps spikes (client_errors): one
#     not seen in the week before happens 10+ times in an hour, or any 100+,
#   - any plan quota reaches 80%: database size, stored files, file downloads,
#     monthly active users, edge function calls (Supabase Pro), and Groq's free
#     daily caps per voice-agent model (QUOTAS in the script).
# Repeats become comments on the open issue; the next quiet hour closes it.
# Counts and function names only: the repo is public.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backend-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Read the last hour of logs
        run: node scripts/backend-alerts.mjs --out problems.md

      - name: Raise or clear the backend issue
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Alert: backend sign-in, error or cost spike"
          gh label create alert --color B60205 --description "Production monitor" 2>/dev/null || true
          open="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -s problems.md ]; then
            body="$(printf '%s\n\nChecked %s. Run: %s\nLogs: Supabase dashboard > Logs.' "$(cat problems.md)" "$(date -u +%FT%TZ)" "$RUN_URL")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --label alert --body "$body"; fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Quiet again at $(date -u +%FT%TZ)."
          fi
