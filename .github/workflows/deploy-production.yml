name: Deploy production

# The gate between a green CI run and production. CI became a multi-job
# workflow on 2026-09-15 (build + four test shards + the timing-sensitive
# suites, aggregated by its `ci-gate` job). `workflow_run` reports the whole
# workflow's conclusion, so `conclusion == 'success'` below still means every
# blocking CI job passed — including all four shards. No per-job check is
# needed here, and none should be added: it would silently stop gating the day
# a job is renamed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # `conclusion == 'success'` is the aggregate of every CI job: build, all
    # four test shards, and the timing-sensitive suites. A red shard makes the
    # CI run red, which skips this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Recheck release contract
        run: node scripts/release-integrity.mjs --static

      - name: Recheck production dependency licenses
        run: npm run check:licenses

      - name: Type-check Supabase functions before production
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply every pending database migration
        run: supabase db push --linked --yes

      - name: Deploy shared email renderer first
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api send-email

      - name: Deploy invite handler after its database and email dependencies
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api send-invite-email

      - name: Deploy remaining Supabase functions
        run: >-
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api --jobs 4
          create-checkout-session
          create-portal-session
          excel-apply-changeset
          send-profile-change-notification
          stripe-webhook

      - name: Verify database, functions, Stripe, and endpoint health
        run: node scripts/release-integrity.mjs --remote

      - name: Confirm main still points to the tested revision
        shell: bash
        run: |
          tested_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$tested_sha"

      - name: Deploy frontend to Vercel only after backend success
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uLSMMTmD4LhtDBm9qJ8DV59v
          VERCEL_PROJECT_ID: prj_ix7x9o7mg5Xi5XXVra0kzP3X7o3p
        run: |
          # Token-based CLI deploy replaced the git deploy hook on 2026-08-18:
          # the repo moved to the Kal-Voe org and Vercel's Hobby plan cannot
          # git-connect private org-owned repos, so hook/git deploys are gone.
          tested_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          npm install -g vercel@latest
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$tested_sha"

      - name: Verify the exact revision reached production
        shell: bash
        run: |
          tested_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          for attempt in $(seq 1 120); do
            live_sha="$(curl --fail --silent --show-error \
              "https://surveytool.app/release.json?attempt=$attempt" \
              | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$live_sha" = "$tested_sha" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "surveytool.app did not reach revision $tested_sha" >&2
          exit 1

      - name: Record deployment
        run: |
          echo "### Production deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Revision: \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://surveytool.app" >> "$GITHUB_STEP_SUMMARY"
