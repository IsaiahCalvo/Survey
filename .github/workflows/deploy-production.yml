name: Deploy production

# The gate between a green CI run and production. "Build and tests" became a
# multi-job workflow on 2026-09-15: four parallel test shards, one runner for
# the slow isolated suites and the speed measurements, and a `ci-gate` job that
# builds the app and aggregates the rest. `workflow_run` reports the whole
# workflow's conclusion, so `conclusion == 'success'` below still means every
# BLOCKING CI job passed — including all four shards and the build. The speed
# measurements run in a step carrying `continue-on-error: true`, so a red timing
# reading leaves the run's conclusion green and a deploy goes ahead: that is
# deliberate, and the reason it exists. No per-job check is needed here, and
# none should be added: it would silently stop gating the day a job is renamed.
on:
  workflow_run:
    # 2026-09-15 — this must stay character-for-character equal to the `name:`
    # in .github/workflows/ci.yml; `workflow_run` matches on the workflow's
    # display name, not its filename, so a rename that misses this line would
    # silently stop every production deploy. scripts/release-integrity.mjs
    # asserts the two are still paired, and that check runs in CI.
    workflows: ["Build and tests"]
    types: [completed]
  # So a window opens even when no tests run (quiet nights), `pick` is also
  # asked every 15 minutes. GitHub drops many of this repo's scheduled runs,
  # so one cron per window was not enough; `pick` skips in seconds unless the
  # window is open and something newer is green.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# 2026-09-15 — the `production-deploy` concurrency group used to sit HERE, at
# workflow level, and it was cancelling real deploys.
#
# This workflow fires on every completion of "Build and tests", and the vast
# majority of those are pull-request runs whose deploy job the `if:` below
# skips. A workflow-level group is entered by the RUN, before any job condition
# is evaluated, so every one of those skipped runs still joined the queue — and
# GitHub cancels a previously pending run when a newer one queues. A genuine
# main deploy sitting pending behind an in-flight one was therefore cancelled
# the moment the next bot pull request finished its CI, silently and with no red
# X: runs 34921705229 and 34921689758 on 2026-09-15 were exactly that.
#
# The group now lives on the deploy job, under its `if:`, so only runs that are
# actually going to deploy ever enter it. cancel-in-progress stays false — a
# deploy in flight is never interrupted.

jobs:
  deploy:
    # The `pick` job (below, kept after this one so the release contract's
    # ordering check reads this job first) chooses the newest main commit whose
    # "Build and tests" run passed. That run's conclusion is the aggregate of
    # every blocking CI job: all four test shards, the slow isolated suites,
    # and the build inside `ci-gate`.
    needs: pick
    if: needs.pick.outputs.ship == 'true'
    # Job-level on purpose — see the note above `jobs:`. A skipped run must
    # never enter this group, or it cancels a pending real deploy.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout the exact tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pick.outputs.sha }}
          # Full history, so the freshness check below can tell which of two
          # revisions is newer.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.7.5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.111.0

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Recheck release contract
        run: node scripts/release-integrity.mjs --static

      - name: Recheck production dependency licenses
        run: npm run check:licenses

      - name: Type-check Supabase functions before production
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Link production database
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply every pending database migration
        run: supabase db push --linked --yes

      - name: Deploy shared email renderer first
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api send-email

      - name: Deploy invite handler after its database and email dependencies
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api send-invite-email

      - name: Deploy remaining Supabase functions
        run: >-
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api --jobs 4
          agent-auth
          agent-identity
          create-checkout-session
          create-portal-session
          delete-account
          export-account
          excel-apply-changeset
          kits-admin
          send-profile-change-notification
          stripe-webhook
          survey-agent
          survey-mcp
          survey-undo

      - name: Verify database, functions, Stripe, and endpoint health
        run: node scripts/release-integrity.mjs --remote

      - name: Ship only if this revision is newer than what is live
        # 2026-10-20 — this step used to fail whenever main had moved since CI
        # started. With merges every few minutes main nearly always had moved,
        # so the frontend deploy never ran and merged work stayed off
        # surveytool.app. What the check is really for: never put an OLDER
        # revision over a newer one (two CI runs can finish out of order).
        # So: ship when main still points here, or when what is live is older
        # than this revision; skip, green, when live is already this or newer.
        #
        # 2026-10-21 — it also rechecks the 3-hour window (see `pick`). Two
        # CI runs can both pick "ship" before either deploys; the second one
        # then waits here, behind the first, in the concurrency group. Once
        # the first has shipped, live is minutes old again, so the second
        # applies its backend changes (which always go first and must work
        # with the older frontend anyway) and leaves Vercel for the next
        # window.
        id: freshness
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          URGENT: ${{ needs.pick.outputs.urgent }}
          WINDOW_SECONDS: '10500'
        run: |
          tested_sha="${{ needs.pick.outputs.sha }}"
          built="$(curl --fail --silent https://surveytool.app/release.json | jq -r '.builtAt // empty' 2>/dev/null || true)"
          if [ "$EVENT" != workflow_dispatch ] && [ "$URGENT" != true ] && [ -n "$built" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "$built" +%s) ))
            if [ "$age" -lt "$WINDOW_SECONDS" ]; then
              echo "Production shipped ${age}s ago, after this run was picked; leaving Vercel for the next window."
              echo "ship=false" >> "$GITHUB_OUTPUT"
              echo "### Skipped Vercel: production shipped ${age}s ago (3-hour window)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" = "$tested_sha" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin main
          live_sha="$(curl --fail --silent https://surveytool.app/release.json | jq -r '.commit // empty' 2>/dev/null || true)"
          if [ -n "$live_sha" ] && git cat-file -e "$live_sha^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$tested_sha" "$live_sha"; then
            echo "Live ($live_sha) already includes $tested_sha; nothing to ship."
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "### Skipped: production already runs \`$live_sha\`, which includes this revision" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Main moved on to $remote_sha, but live ($live_sha) is older than $tested_sha: shipping it."
          echo "ship=true" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend to Vercel only after backend success
        id: vercel
        if: steps.freshness.outputs.ship == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uLSMMTmD4LhtDBm9qJ8DV59v
          VERCEL_PROJECT_ID: prj_ix7x9o7mg5Xi5XXVra0kzP3X7o3p
        run: |
          # Token-based CLI deploy replaced the git deploy hook on 2026-08-18:
          # the repo moved to the Kal-Voe org and Vercel's Hobby plan cannot
          # git-connect private org-owned repos, so hook/git deploys are gone.
          tested_sha="${{ needs.pick.outputs.sha }}"
          npm install -g vercel@latest
          set +e
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env VERCEL_GIT_COMMIT_SHA="$tested_sha" 2>&1 | tee vercel.log
          status=${PIPESTATUS[0]}
          if grep -q 'api-deployments-free-per-day' vercel.log; then echo "capped=true" >> "$GITHUB_OUTPUT"; fi
          exit "$status"

      # 2026-10-21 — Vercel's free plan refuses deploys past 100 in a rolling
      # 24 hours. A refused deploy doesn't count, but without this mark every
      # CI run (and a `[deploy now]` commit) would try again within minutes.
      # `pick` reads the newest mark and waits 30 minutes before the next try.
      - name: Mark that Vercel's daily cap was hit
        if: failure() && steps.vercel.outputs.capped == 'true'
        run: mkdir -p .vercel-capped && date -u +%FT%TZ > .vercel-capped/at && echo "key=vercel-capped-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
        id: capmark
      - if: failure() && steps.vercel.outputs.capped == 'true'
        uses: actions/cache/save@v4
        with:
          path: .vercel-capped
          key: ${{ steps.capmark.outputs.key }}

      - name: Verify the exact revision reached production
        if: steps.freshness.outputs.ship == 'true'
        shell: bash
        run: |
          tested_sha="${{ needs.pick.outputs.sha }}"
          for attempt in $(seq 1 120); do
            live_sha="$(curl --fail --silent --show-error \
              "https://surveytool.app/release.json?attempt=$attempt" \
              | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$live_sha" = "$tested_sha" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "surveytool.app did not reach revision $tested_sha" >&2
          exit 1

      - name: Record deployment
        if: steps.freshness.outputs.ship == 'true'
        run: |
          {
            echo "### Production deployment complete"
            echo "- Revision: \`${{ needs.pick.outputs.sha }}\`"
            echo "- URL: https://surveytool.app"
          } >> "$GITHUB_STEP_SUMMARY"

  # 2026-10-21 — production ships at most once every 3 hours. Vercel's free
  # plan allows 100 deploys a day for the whole account, and a deploy per merge
  # hit that cap (about half of all deploys failed that morning). The owner
  # chose a 3-hour cadence. Runs on every finished CI run (any branch) and
  # decides whether a window is open:
  #   - nothing new: the newest green main commit is already live → skip;
  #   - run by hand, or a commit since the live one says `[deploy now]` in its
  #     message → ship now (urgent fixes; rollbacks are Vercel's instant
  #     rollback and never wait on this);
  #   - otherwise ship only when what is live was built 3 hours ago or more.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      ship: ${{ steps.pick.outputs.ship }}
      urgent: ${{ steps.pick.outputs.urgent }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 300

      - name: When did Vercel's daily cap last refuse a deploy?
        id: cap
        uses: actions/cache/restore@v4
        with:
          path: .vercel-capped
          key: vercel-capped-none
          restore-keys: vercel-capped-
          lookup-only: true

      - name: Pick the newest green main commit and decide whether to ship
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CAP_KEY: ${{ steps.cap.outputs.cache-matched-key }}
          CAP_WAIT_SECONDS: '1800'
          EVENT: ${{ github.event_name }}
          WINDOW_SECONDS: '10500'
        run: |
          green="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[].head_sha')"
          sha=""
          for c in $(git rev-list --max-count=300 HEAD); do
            if grep -qx "$c" <<< "$green"; then sha="$c"; break; fi
          done
          if [ -z "$sha" ]; then
            echo "No green main commit in the last 300."; echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          release="$(curl --fail --silent https://surveytool.app/release.json || echo '{}')"
          live="$(jq -r '.commit // empty' <<< "$release" 2>/dev/null || true)"
          built="$(jq -r '.builtAt // empty' <<< "$release" 2>/dev/null || true)"
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$sha" "$live"; then
            echo "Live ($live) already includes $sha."; echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != workflow_dispatch ] && [[ "$CAP_KEY" =~ ^vercel-capped-([0-9]{8})([0-9]{2})([0-9]{2})$ ]]; then
            capped_at=$(date -u -d "${BASH_REMATCH[1]} ${BASH_REMATCH[2]}:${BASH_REMATCH[3]}" +%s)
            since=$(( $(date -u +%s) - capped_at ))
            if [ "$since" -lt "$CAP_WAIT_SECONDS" ]; then
              echo "Vercel's daily cap refused a deploy $(( since / 60 )) min ago; next try in $(( (CAP_WAIT_SECONDS - since) / 60 )) min."
              echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Run by hand: shipping $sha."; echo "ship=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
            && git log --format=%B "$live..$sha" | grep -qF '[deploy now]'; then
            echo "A commit since $live asks for [deploy now]: shipping $sha."
            echo "ship=true" >> "$GITHUB_OUTPUT"; echo "urgent=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          age=999999
          [ -n "$built" ] && age=$(( $(date -u +%s) - $(date -u -d "$built" +%s) ))
          if [ "$age" -lt "$WINDOW_SECONDS" ]; then
            echo "Live was built ${age}s ago; next window in $(( (WINDOW_SECONDS - age) / 60 )) min."
            echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Window open (live built ${age}s ago): shipping $sha."
          echo "ship=true" >> "$GITHUB_OUTPUT"
          echo "### Shipping \`$sha\` (live was \`${live:-unknown}\`)" >> "$GITHUB_STEP_SUMMARY"
