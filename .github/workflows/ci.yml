name: Build and tests

# 2026-05-28 — Build + test gate. Before this, a broken change could land on
# main with a green checkmark because nothing ran the build or the full test
# suite. This is the guardrail that makes parallel work safe: a bad cross-edit
# now shows up as a red X instead of being discovered by hand later.
#
# 2026-09-15 — Renamed from "CI" to "Build and tests" so the failure email
# subject ("Run failed: Build and tests — …") says what actually broke in
# words. `run-name` below gives every run a plain-English title, and `ci-gate`
# writes a plain-English summary onto the run page. The deploy gate keys off
# this workflow's NAME (deploy-production.yml `workflow_run`), and
# scripts/release-integrity.mjs now asserts those two stay paired, so a future
# rename cannot silently switch production deploys off.
#
# 2026-09-15 — Split into parallel jobs. The old single job ran everything in
# series and took a median of 380s, of which 333s was `npm test` alone on a
# multi-core runner that sat 78% idle. The suite is top-heavy (479 of 512 files
# finish in under a second), so it now runs as four balanced shards in
# parallel, alongside the build. The suites that must not share a machine are
# NOT in any shard — they run alone, one process at a time, in `timing-suites`
# and `perf`, because neighbouring load is what has historically tripped them.
#
# 2026-09-15 — Two different answers to "a timing reading must not veto a
# merge", and both are in force:
#   * `perf` is informational. Every file that asserts a millisecond budget
#     runs there with `continue-on-error: true`, and `ci-gate` does not need it.
#   * Dependabot's bumps skip the blocking isolated suites (SKIP_TIMING_SUITES
#     below). A routine version bump cannot regress them, and everything else
#     still runs on a bump — including the license check.
#
# 2026-09-15 — every "was this a bot or a person?" decision below reads
# `github.triggering_actor`, NOT `github.actor`. GitHub documents github.actor as
# "the username of the user that triggered the INITIAL workflow run. If the
# workflow run is a re-run, this value may differ from github.triggering_actor"
# (Actions reference → Contexts). On a re-run github.actor stays dependabot[bot]
# forever, so keying off it would have made the documented "re-run a bump by hand
# to get the isolated suites" escape hatch impossible to use. The one exception
# is the license step, which runs when EITHER actor is the bot — see there.
#
# 2026-09-15 — THE MINUTES BUDGET, because the split is not free. The account is
# on the GitHub Free plan: 2,000 Actions minutes a month, and this repository is
# private, so every job minute is billed. Four shards plus the isolated and perf
# runners each pay their own checkout and `npm install`, which takes one CI run
# from roughly 7 billed minutes to roughly 23, and the month from ~523 minutes
# to ~1,088 (~1,436 all-in, counting Deploy production, License check and the
# desktop Release runs). That is inside the allowance but uncomfortably close,
# and it would not have survived the auto-merge: merged bumps free slots for
# Dependabot to refill weekly, and each merged bump now also costs a run on main
# and a deploy.
#
# So the run COUNT came down instead of the split:
#
#   ~47 CI runs/month at ~23 billed min      = ~1,088 min
#   - grouping the bumps (.github/dependabot.yml): one pull request per
#     ecosystem per month instead of ~20 bump runs      -18 runs   -414 min
#   + the auto-merge's re-run on main, 2/month           +2 runs    +46 min
#   - paths-ignore below: root notes and graphify-out
#     refreshes, ~4 pushes a month                       -4 runs    -92 min
#   ------------------------------------------------------------------------
#   ≈ 628 min/month of CI, ≈ 976 min/month all-in, of 2,000.
#
# The run counts are estimates from the September 2026 history; the per-run
# minutes are not. If the allowance ever stops being the binding constraint, the
# note on the `test` job below says what a fifth shard would buy.
#
# `ci-gate` is the single aggregate that must be green, and the Deploy
# production workflow keys off this workflow's conclusion.

on:
  push:
    branches: [main]
    # 2026-09-15 — pushes and pull requests that touch ONLY these never change
    # what gets built or tested, and on the Free plan every skipped run is ~23
    # billed runner-minutes kept. The list is deliberately narrow: `docs/**` and
    # `.planning/**` are NOT on it, because tests read files out of both
    # (docs/MOBILE-RUN.md, docs/FULL-APP-E2E.md, the KAL-260/261/262 baseline
    # reports), and ignoring them would let an edit break main unseen. `*.md`
    # has no slash in it, so it matches root-level notes only, not docs/*.md.
    # The two lists are written out twice on purpose: YAML anchors are not
    # supported in GitHub Actions workflows.
    paths-ignore:
      - '*.md'
      - 'graphify-out/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'graphify-out/**'
  # 2026-09-15 — added so .github/workflows/dependabot-auto-merge.yml can
  # re-run this workflow on main after it squash-merges a bump. GitHub creates
  # NO workflow run for a push made with the repository's GITHUB_TOKEN, so the
  # merge commit would otherwise never be tested on main and
  # deploy-production.yml (workflow_run on this workflow) would never fire.
  # GitHub's own words, Actions → "Trigger a workflow" → "Triggering a workflow
  # from a workflow": "When you use the repository's GITHUB_TOKEN to perform
  # tasks, events triggered by the GITHUB_TOKEN will not create a new workflow
  # run, with the following exceptions: workflow_dispatch and
  # repository_dispatch events ALWAYS create workflow runs." That exception is
  # the whole mechanism, and it needs no personal access token.
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Build and tests — PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Build and tests — main: {0}', github.sha) }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  DENO_VERSION: v2.7.5

jobs:
  # Static contract + type-check + the web bundle. Runs in parallel with the
  # tests; on the runner the whole job is ~45s, of which vite is ~3s.
  build:
    name: Build the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Restores ~/.npm so `npm install` below resolves from cache.
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Deno re-downloads every remote import on a cold runner. Keyed on the
      # function sources so a new import busts it and an unchanged tree reuses
      # the whole module graph.
      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ env.DENO_VERSION }}-${{ hashFiles('supabase/functions/deno.json', 'supabase/functions/**/*.ts') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ env.DENO_VERSION }}-

      - name: Verify release contract
        run: node scripts/release-integrity.mjs --static

      - name: Install dependencies
        # Use `install` (not `ci`) to sidestep the npm optional-deps bug
        # (npm/cli#4828), matching the release workflow.
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check dependency licenses
        # Only on dependency bumps: the standalone "License check" workflow
        # skips bot PRs so a bump cannot produce two separate red X's (and two
        # separate emails) for one problem. Same script, same allowlist.
        #
        # 2026-09-15 — this is the ONE place that must read BOTH actors, and it
        # is an OR on purpose. license-gate.yml skips whenever github.actor is
        # the bot, and github.actor never stops being the bot on a bot pull
        # request — not even when a person re-runs it. So if this step keyed off
        # github.triggering_actor alone, a human re-run of a bump would skip the
        # licence check HERE (triggering_actor is the person) and also over
        # THERE (actor is still the bot), and the bump would land having had its
        # licences checked by nobody. The two conditions are exact complements:
        # actor == bot → this step runs; actor != bot → license-gate.yml runs.
        if: github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]'
        run: npm run check:licenses

      # Vite's on-disk cache (dependency pre-bundling + transform results).
      # The bundle build is only ~3s today so this is insurance rather than a
      # big win, but it costs ~1s and keeps the build fast if the config ever
      # grows a heavier pre-bundle step.
      - name: Cache Vite build artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vite.config.js') }}
          restore-keys: |
            vite-${{ runner.os }}-

      - name: Type-check Supabase functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Build web bundle
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNCFUSION_LICENSE_KEY: ${{ secrets.VITE_SYNCFUSION_LICENSE_KEY }}

  # The bulk of the suite, split four ways. `--shard=N/M` is a deterministic
  # longest-processing-time partition of every non-timing-sensitive file:
  # stable ordering, every file in exactly one shard, nothing dropped.
  #
  # 2026-09-15 — an earlier note here claimed a fifth shard "buys nothing"
  # because the heaviest single file (partialEraserSequentialStress, ~59s) is
  # the floor for any shard. That is wrong: at four shards the worst shard is
  # ~78s of estimated test time, comfortably ABOVE that floor, and five shards
  # would bring it to ~62s — a real 20% cut. Six is where the floor actually
  # bites (~59s, a further 6%).
  #
  # Four is a BUDGET choice, not a technical ceiling. Each extra shard is
  # another runner paying its own checkout and `npm install` — about three
  # billed minutes on every CI run, whatever the tests cost — and this account
  # has 2,000 Actions minutes a month for a private repository. A fifth shard
  # would spend roughly 140 minutes a month to save 15 seconds of wall clock per
  # run. If the allowance ever stops being the constraint, five is the next step.
  #
  # Files still run one process at a time INSIDE a shard. The parallelism is
  # across runners, so each machine carries roughly today's load.
  test:
    name: Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every failing shard, not just the first one to go red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run test shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: node scripts/run-node-tests.mjs --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The BLOCKING slow suites, alone on their own runner, one process at a time:
  # annotationDocConcurrency (99 CRDT convergence tests) and
  # svgPathTransformFidelity (no timing assertion at all). Both are correctness
  # gates that merely happen to be slow, so they keep their teeth.
  #
  # The exact file list is TIMING_SENSITIVE_TEST_FILES in
  # scripts/timing-sensitive-tests.mjs MINUS CI_PERF_TEST_FILES in
  # scripts/ci-perf-tests.mjs. The shards above exclude the whole
  # TIMING_SENSITIVE list, so between this job, the shards and `perf` below
  # every test file runs exactly once. `run-node-tests.mjs` fails loudly if a
  # perf file ever falls out of that union and into a shard.
  #
  # Blocking on purpose: if this job is ever given `continue-on-error`,
  # `needs.timing-suites.result` below reports success regardless, so the gate
  # would have to move to an explicit output instead.
  #
  # On a Dependabot bump SKIP_TIMING_SUITES=1 makes the runner print what it is
  # not running and exit 0, so the job stays green by design rather than by
  # accident — see scripts/run-node-tests.mjs for why a version bump cannot
  # regress these.
  timing-suites:
    name: Slow isolated suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run the slow isolated suites one at a time
        run: node scripts/run-node-tests.mjs --only-timing-sensitive
        env:
          # github.triggering_actor, not github.actor: a re-run keeps github.actor
          # pinned to whoever opened the run (the bot, forever), while
          # triggering_actor becomes the person who pressed re-run. Keying off the
          # latter is what actually makes "re-run a bump by hand to get these
          # suites on demand" work — a yjs bump can then be given the full CRDT
          # convergence gate with two clicks.
          SKIP_TIMING_SUITES: ${{ github.triggering_actor == 'dependabot[bot]' && '1' || '' }}

  # 2026-09-15 — The performance lane. Informational ONLY.
  #
  # `continue-on-error: true` means a red job here does NOT fail the workflow,
  # and `ci-gate` below deliberately does not list it in `needs`, so it cannot
  # block a merge and cannot stop deploy-production (which gates on this run's
  # conclusion). That is the entire point: run 34094848036 failed main on
  # "round outline took 341.6ms" against a 250ms budget — twice, on the original
  # run and the rerun — and held a production deploy behind a timing reading
  # taken on a busy 2-core runner, not behind a regression.
  #
  # These suites are NOT deleted and NOT skipped. They run on every CI run, in
  # parallel with the shards, so they add no wall-clock time to the gate.
  # CI_PERF_LANE=1 raises the best-of sample count and applies a 2x slack factor
  # to the millisecond budgets (scripts/ci-perf-tests.mjs) so the lane reds on
  # genuine slowdowns rather than on runner weather. The unscaled budgets still
  # apply to `npm run test:perf` locally.
  #
  # If this job goes red: re-run it alone first (load-sensitive by nature), and
  # only then go looking for the regression.
  perf:
    name: Performance budgets (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run performance budget suites
        run: npm run test:perf
        env:
          CI_PERF_LANE: '1'
          NODE_OPTIONS: --max-old-space-size=8192

  # One required status for branch protection and the Deploy production
  # gate. `if: always()` makes it run even when something upstream failed, so
  # it can turn "cancelled" and "skipped" into an explicit red instead of a
  # silently-green workflow.
  #
  # `perf` is deliberately absent from `needs`: it is informational, and adding
  # it here would hand a timing reading the veto this split exists to remove.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build, test, timing-suites]
    env:
      # Was this pull request opened by the bot? (Stays true across re-runs.)
      IS_DEPENDENCY_BUMP: ${{ github.actor == 'dependabot[bot]' }}
      # Did THIS run skip the slow isolated suites? That is decided by
      # triggering_actor, so a person re-running a bump gets the full suite and
      # a summary that says so, instead of one that still claims they were
      # skipped.
      SKIPPED_ISOLATED_SUITES: ${{ github.triggering_actor == 'dependabot[bot]' }}
      BUILD_RESULT: ${{ needs.build.result }}
      TEST_RESULT: ${{ needs.test.result }}
      TIMING_RESULT: ${{ needs.timing-suites.result }}
    steps:
      - name: Explain this run in plain English
        # Written before the gate step below fails, so the run page (linked from
        # every failure email) opens on a readable explanation rather than on
        # raw logs.
        if: always()
        run: |
          {
            echo "## What this check does"
            echo
            echo "It downloads the app's building blocks, checks the server code,"
            echo "runs the automated tests, and builds the app the way the website"
            echo "and the desktop app are built. If this is green, the change is"
            echo "safe to ship."
            echo
            echo "The tests are split across four machines that run at the same"
            echo "time, plus one machine for the few slow tests that need to be"
            echo "left alone, plus one for the speed measurements."
            echo
            if [ "${SKIPPED_ISOLATED_SUITES}" = "true" ]; then
              echo "**This run was a routine dependency update opened by a robot.**"
              echo "It ran everything except the slow isolated tests, which a"
              echo "version bump cannot affect and which occasionally go red just"
              echo "because the shared machine was busy. Those run in full the"
              echo "moment the update is merged. To run them here instead, press"
              echo "Re-run all jobs — a re-run by a person runs everything."
            elif [ "${IS_DEPENDENCY_BUMP}" = "true" ]; then
              echo "**This is a robot's dependency update, re-run by a person, so"
              echo "everything ran** — the slow isolated tests included."
            else
              echo "**This run was a change made by a person, so everything ran.**"
            fi
            echo
            echo "### Results"
            echo
            echo "- Build: ${BUILD_RESULT}"
            echo "- Tests (four shards): ${TEST_RESULT}"
            echo "- Slow isolated tests: ${TIMING_RESULT}"
            echo
            echo "The speed measurements run on their own and are reported for"
            echo "information only — they can never fail this check or stop a"
            echo "release. If that one is red, re-run it on its own before"
            echo "investigating: it can go red simply because the shared machine"
            echo "was busy."
            echo
            if [ "${BUILD_RESULT}" != "success" ] \
              || [ "${TEST_RESULT}" != "success" ] \
              || [ "${TIMING_RESULT}" != "success" ]; then
              echo "Something above went red. Open the job marked with a red X —"
              echo "its name says which part broke: the build, one of the four"
              echo "test shards, or the slow isolated tests."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require every CI job to have succeeded
        shell: bash
        run: |
          echo "build=$BUILD_RESULT test=$TEST_RESULT timing-suites=$TIMING_RESULT"
          failed=0
          for result in "$BUILD_RESULT" "$TEST_RESULT" "$TIMING_RESULT"; do
            if [ "$result" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::CI is not green — see the failing job above." >&2
            exit 1
          fi
          echo "All CI jobs succeeded."
