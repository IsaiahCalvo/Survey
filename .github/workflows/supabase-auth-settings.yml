name: Supabase auth settings

# Reads (check) or sets (apply) the Supabase Auth settings from the backend
# security pass: leaked-password check, 8+ characters with upper, lower and
# digits, confirm email, optional MFA, rate limits, auth connections as a
# percentage, and current password for password changes. Isaiah approved
# applying them 2026-10-21. Prints only those settings, never secrets.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (read only) or apply"
        required: true
        type: choice
        default: check
        options:
          - check
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-auth-settings
  cancel-in-progress: false

jobs:
  auth-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read or apply
        run: node scripts/supabase-auth-settings.mjs ${{ inputs.mode == 'apply' && '--apply' || '' }}
