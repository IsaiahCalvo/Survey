name: Daily crash summary

# Once a day, counts the crashes browsers and the phone apps sent to the
# client_errors table (src/utils/crashReporter.js) in the last 24 hours and
# posts them as one comment on a single open issue labelled crash-report, so
# the owner gets at most one email a day, and none on a day with no crashes.
# It also deletes reports older than 30 days. Reads the table through the
# Supabase Management API with the same token the production deploy uses;
# the table itself is closed to browsers.

# GitHub runs this repo's cron schedules only now and then (one scheduled run
# of any workflow on 2026-10-21 while ~350 others ran), so every finished
# "Build and tests" run also starts it. The first such run after 07:00 UTC
# each day posts; the rest of that day skip (a day-keyed cache entry marks it).
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_run:
    workflows: ["Build and tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: crash-summary
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.when.outputs.key }}
      checked: ${{ steps.mark.outputs.cache-hit }}
      early: ${{ steps.when.outputs.early }}
    steps:
      - name: This day's mark
        id: when
        run: |
          echo "key=crash-summary-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          [ "$(date -u +%H)" -lt 7 ] && echo "early=true" >> "$GITHUB_OUTPUT" || true
      - name: Already done this day?
        id: mark
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .crash-summary-mark
          key: ${{ steps.when.outputs.key }}
          lookup-only: true

  summary:
    needs: due
    # Not before 07:00 UTC, so the day's summary still covers the night.
    if: needs.due.outputs.checked != 'true' && (github.event_name != 'workflow_run' || needs.due.outputs.early != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Count yesterday's crashes and drop old ones
        shell: bash
        run: |
          query() {
            jq -n --arg q "$1" '{query: $q}' | curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              --data @- "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query"
          }
          query "select kind, platform, build, left(message, 160) as message, sum(repeats)::int as times, count(*)::int as reports
                 from public.client_errors where received_at > now() - interval '24 hours'
                 group by 1, 2, 3, 4 order by times desc limit 25" > rows.json
          query "select coalesce(sum(repeats), 0)::int as times from public.client_errors
                 where received_at > now() - interval '24 hours'" | jq '.[0].times' > total.txt
          query "delete from public.client_errors where received_at < now() - interval '30 days'" > /dev/null
          jq length rows.json

      - name: Post the summary
        shell: bash
        run: |
          [ "$(jq length rows.json)" = 0 ] && { echo "No crashes in the last 24 hours."; exit 0; }
          total="$(cat total.txt)"
          table="$(jq -r '.[] | "| \(.times) | \(.kind) | \(.platform // "") | \(.build // "") | \(.message | gsub("\\|"; "/") | gsub("\n"; " ")) |"' rows.json)"
          body="$(printf '**%s crashes in the 24 hours to %s**\n\n| Times | Kind | Platform | Build | Message |\n|---|---|---|---|---|\n%s\n\nTop 25 groups. Full records stay in each person'\''s Settings → Crash reports.' "$total" "$(date -u +%FT%TZ)" "$table")"
          title="Daily crash summary"
          gh label create crash-report --color D93F0B --description "Daily crash summary" 2>/dev/null || true
          open="$(gh issue list --label crash-report --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
          else gh issue create --title "$title" --label crash-report --body "$body"; fi

      - name: Mark today done
        run: mkdir -p .crash-summary-mark && date -u +%FT%TZ > .crash-summary-mark/at
      - uses: actions/cache/save@v4
        with:
          path: .crash-summary-mark
          key: ${{ needs.due.outputs.key }}
