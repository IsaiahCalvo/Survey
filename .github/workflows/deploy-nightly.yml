name: Deploy nightly

# Nightly is a second copy of the web app with every feature flag turned on
# (VITE_RELEASE_CHANNEL=nightly, see src/featureFlags.js). It is built from the
# same main commit surveytool.app is serving, once a day (or on demand), so it
# shares the one production database whose migrations that deploy already
# applied. Once a day, not after every production deploy: Vercel's free plan
# allows 100 deploys a day for the whole account, and a nightly copy of every
# production deploy doubled the count and hit that cap on 2026-10-21.
# Stable people see only flags turned on at /flags; nightly people see
# everything. How work moves from nightly to stable: docs/RELEASE-CHANNELS.md.
#
# Address: https://surveytool-nightly.vercel.app (a preview deployment of the
# production Vercel project, aliased; no new domain).
#
# GitHub runs this repo's cron schedules only now and then (one scheduled run
# of any workflow on 2026-10-21 while ~350 others ran), so every finished
# "Deploy production" run also starts it, and the first one each UTC day
# deploys; the rest of that day skip (a day-keyed cache entry marks it done).
# The schedule stays as a backup. Run by hand to deploy again the same day.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      key: ${{ steps.day.outputs.key }}
      done: ${{ steps.mark.outputs.cache-hit }}
      wait: ${{ steps.capwait.outputs.wait }}
    steps:
      - name: Today's mark
        id: day
        run: echo "key=nightly-deploy-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Already deployed today?
        id: mark
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .nightly-deploy-day
          key: ${{ steps.day.outputs.key }}
          lookup-only: true
      # Production comes first: while Vercel's daily cap is refusing deploys
      # (deploy-production.yml leaves a mark), nightly waits too, so the first
      # free slot goes to surveytool.app.
      - name: When did Vercel's daily cap last refuse a deploy?
        id: cap
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .vercel-capped
          key: vercel-capped-none
          restore-keys: vercel-capped-
          lookup-only: true
      - name: Wait out the cap
        id: capwait
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          CAP_KEY: ${{ steps.cap.outputs.cache-matched-key }}
        run: |
          if [[ "$CAP_KEY" =~ ^vercel-capped-([0-9]{8})([0-9]{2})([0-9]{2})$ ]]; then
            capped_at=$(date -u -d "${BASH_REMATCH[1]} ${BASH_REMATCH[2]}:${BASH_REMATCH[3]}" +%s)
            # Two hours: long enough for production to take the next free slot.
            if [ $(( $(date -u +%s) - capped_at )) -lt 7200 ]; then
              echo "Vercel's cap refused a deploy recently; nightly waits."; echo "wait=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy:
    needs: due
    if: needs.due.outputs.done != 'true' && needs.due.outputs.wait != 'true'
    # Not cancel-in-progress: with a run started after every production run,
    # a newer run would keep cancelling the one deploying. At most one more
    # waits, so nightly ships at most twice on a busy day.
    concurrency:
      group: nightly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NIGHTLY_HOST: surveytool-nightly.vercel.app
      VERCEL_SCOPE: team_uLSMMTmD4LhtDBm9qJ8DV59v

    steps:
      - name: Find the revision production is serving
        id: live
        shell: bash
        run: |
          sha="$(curl --fail --silent --show-error https://surveytool.app/release.json | jq -r '.commit // empty')"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "surveytool.app/release.json gave no commit" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the revision production is serving
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.live.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Deploy a nightly preview of the production project
        # The Vercel token can reach only the production project (creating a
        # separate nightly project returned 403), so nightly is a preview
        # deployment of that project, built by Vercel from this checkout the
        # same way production is, then aliased to the nightly address.
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uLSMMTmD4LhtDBm9qJ8DV59v
          VERCEL_PROJECT_ID: prj_ix7x9o7mg5Xi5XXVra0kzP3X7o3p
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          tested_sha="${{ steps.live.outputs.sha }}"
          npm install -g vercel@latest
          url="$(vercel deploy --yes --token "$VERCEL_TOKEN" \
            --build-env VITE_RELEASE_CHANNEL=nightly \
            --build-env VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-env VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            --build-env VERCEL_GIT_COMMIT_SHA="$tested_sha")"
          echo "Deployed $url"
          # `vercel alias set` looks up the token's user and fails ("User not
          # found") for this team-scoped token, so alias through the REST API.
          api="https://api.vercel.com"
          auth="Authorization: Bearer $VERCEL_TOKEN"
          id="$(curl --fail --silent --show-error -H "$auth" "$api/v13/deployments/${url#https://}?teamId=$VERCEL_SCOPE" | jq -r '.id')"
          jq -n --arg alias "$NIGHTLY_HOST" '{alias: $alias}' \
            | curl --fail-with-body --silent --show-error -X POST -H "$auth" -H 'Content-Type: application/json' \
                --data @- "$api/v2/deployments/$id/aliases?teamId=$VERCEL_SCOPE"
          echo

      - name: Let sign-in links come back to nightly
        # Adds the nightly address to Supabase Auth's redirect allow list once,
        # so Google sign-in and email links return to nightly, not production.
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth"
          current="$(curl --fail --silent --show-error -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" | jq -r '.uri_allow_list // ""')"
          entry="https://$NIGHTLY_HOST/**"
          case ",$current," in
            *",$entry,"*) echo "Already allowed: $entry"; exit 0 ;;
          esac
          next="$(printf '%s' "$current" | sed 's/,*$//')"
          next="${next:+$next,}$entry"
          jq -n --arg list "$next" '{uri_allow_list: $list}' \
            | curl --fail --silent --show-error -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H 'Content-Type: application/json' --data @- "$api" > /dev/null
          echo "Allowed: $entry"

      - name: Verify nightly serves this revision
        # Informational: nightly stays behind Vercel's preview sign-in on
        # purpose, so this anonymous read usually gets Vercel's login page.
        # It passes only if that protection is ever lifted.
        continue-on-error: true
        shell: bash
        run: |
          tested_sha="${{ steps.live.outputs.sha }}"
          for attempt in $(seq 1 60); do
            live_sha="$(curl --fail --silent "https://$NIGHTLY_HOST/release.json?attempt=$attempt" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$live_sha" = "$tested_sha" ]; then
              echo "### Nightly is live at https://$NIGHTLY_HOST (\`$tested_sha\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "$NIGHTLY_HOST did not reach revision $tested_sha" >&2
          exit 1

      - name: Mark today deployed
        run: mkdir -p .nightly-deploy-day && date -u +%FT%TZ > .nightly-deploy-day/at
      - uses: actions/cache/save@v4
        # A hand-run deploy on a day already marked would fail to save the
        # same key again; that is harmless, so it must not turn the run red.
        continue-on-error: true
        with:
          path: .nightly-deploy-day
          key: ${{ needs.due.outputs.key }}
