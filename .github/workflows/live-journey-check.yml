name: Live journey check

# Every hour, a dedicated test account walks the signed-in path on
# surveytool.app: sign in, upload a PDF, draw a rectangle, see it saved,
# export it, delete it (scripts/live-journey-check.mjs). A failure keeps one
# open `alert` issue (the status page reads those); the next pass closes it.
#
# OFF until the owner says yes: it writes to the live database and storage on
# every run. To turn it on, create the account on production, then set the
# repo secret LIVE_JOURNEY_EMAIL and the repo variable LIVE_JOURNEY_ENABLED=true.
# The script never creates an account and deletes every document the account
# owns before and after each run.

# GitHub runs this repo's cron schedules only now and then (one scheduled run
# of any workflow on 2026-10-21 while ~350 others ran), so every finished
# "Build and tests" run also starts it. The first run in each UTC hour walks
# the path; the rest of that hour skip (they look for an earlier run this hour
# whose journey job ran). Not a cache mark: runs started by workflow_run can
# get a read-only Actions cache, so marks don't always save.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_run:
    workflows: ["Build and tests"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: live-journey-check
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      checked: ${{ steps.mark.outputs.checked }}
    steps:
      # Runs share one concurrency group, so any earlier run has finished.
      - name: Already done this hour?
        id: mark
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          since="$(date -u +%Y-%m-%dT%H:00:00Z)"
          ids="$(gh api "repos/$GH_REPO/actions/workflows/live-journey-check.yml/runs?created=>=$since&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id")"
          for id in $ids; do
            if gh api "repos/$GH_REPO/actions/runs/$id/jobs" \
                --jq '.jobs[] | select(.name == "journey" and .conclusion != null and .conclusion != "skipped") | .id' | grep -q .; then
              echo "Run $id already walked the path this hour."; echo "checked=true" >> "$GITHUB_OUTPUT"; break
            fi
          done

  journey:
    needs: due
    if: vars.LIVE_JOURNEY_ENABLED == 'true' && needs.due.outputs.checked != 'true'
    # Playwright 1.59 has no browsers for ubuntu-26.04, which ubuntu-latest
    # became in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Walk the signed-in path on surveytool.app
        id: journey
        continue-on-error: true
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          JOURNEY_EMAIL: ${{ secrets.LIVE_JOURNEY_EMAIL }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          # The service key makes the one-time sign-in link (the live sign-in
          # form has a CAPTCHA) and cleans up; it is read here, never stored.
          SUPABASE_SERVICE_ROLE_KEY="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY
          node scripts/live-journey-check.mjs 2>&1 | tee journey.log

      - name: Keep the failure screenshot
        if: steps.journey.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: live-journey-failure
          path: live-journey-failure.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Raise or clear the journey issue
        shell: bash
        env:
          RESULT: ${{ steps.journey.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Alert: live sign-in, upload or export check failed"
          gh label create alert --color B60205 --description "Production monitor" 2>/dev/null || true
          open="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ "$RESULT" != success ]; then
            body="$(printf 'The hourly signed-in check failed:\n```\n%s\n```\nRun: %s\nWhat to do: docs/ROLLBACK.md' "$(tail -n 20 journey.log 2>/dev/null)" "$RUN_URL")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --label alert --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Passed again at $(date -u +%FT%TZ)."
          fi
