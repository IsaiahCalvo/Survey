name: Monitor production

# Watches surveytool.app and raises a GitHub issue (labelled `alert`) when
# something is wrong, so the owner gets one email per problem:
#   - uptime: every 15 minutes, the site, release.json and Supabase Auth must
#     answer. Three failed tries in a row count as down.
#   - deploy: when "Deploy production" fails, or when it succeeds but the
#     signed-out smoke test (scripts/prod-smoke.mjs) fails against the live site.
# Each kind of problem keeps one open issue; repeats become comments on it, and
# the issue closes itself on the next healthy check. Runbook: docs/ROLLBACK.md.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: ["Deploy production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-${{ github.event_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  uptime:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the site, release.json and Supabase Auth
        id: check
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          probe() { # name url [header]
            for try in 1 2 3; do
              code="$(curl --silent --output /dev/null --max-time 20 --write-out '%{http_code}' ${3:+-H "$3"} "$2" || true)"
              [ "$code" = 200 ] && { echo "$1 ok"; return 0; }
              sleep 20
            done
            echo "- $1 answered $code three times ($2)" >> problems.md
          }
          : > problems.md
          probe "Site" "https://surveytool.app/"
          probe "release.json" "https://surveytool.app/release.json"
          probe "Supabase Auth" "$SUPABASE_URL/auth/v1/health" "apikey: $SUPABASE_ANON_KEY"
          if [ -s problems.md ]; then echo "down=true" >> "$GITHUB_OUTPUT"; cat problems.md; fi

      - name: Raise or clear the outage issue
        shell: bash
        env:
          DOWN: ${{ steps.check.outputs.down }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Alert: surveytool.app is down"
          gh label create alert --color B60205 --description "Production monitor" 2>/dev/null || true
          open="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ "$DOWN" = true ]; then
            body="$(printf '%s\n\nChecked %s. Run: %s\nWhat to do: docs/ROLLBACK.md' "$(cat problems.md)" "$(date -u +%FT%TZ)" "$RUN_URL")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --label alert --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Back up: every check answered at $(date -u +%FT%TZ)."
          fi

  deploy:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    # Playwright 1.59 has no browsers for ubuntu-26.04, which ubuntu-latest
    # became in October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the shipped revision
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history, so the release notes can list every commit since
          # the last one noted.
          fetch-depth: 0

      - name: Setup Node.js
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Smoke test the live site
        id: smoke
        if: github.event.workflow_run.conclusion == 'success'
        continue-on-error: true
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          # A run that only skipped the frontend (an older revision) leaves
          # another commit live, so check the commit only when this one shipped.
          live="$(curl --silent https://surveytool.app/release.json | jq -r '.commit // empty' || true)"
          expect=()
          [ "$live" = "${{ github.event.workflow_run.head_sha }}" ] && expect=(--expect-commit "$live")
          node scripts/prod-smoke.mjs "${expect[@]}" 2>&1 | tee smoke.log

      - name: Raise or clear the deploy issue
        shell: bash
        env:
          DEPLOY_RESULT: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_URL: ${{ github.event.workflow_run.html_url }}
          SMOKE: ${{ steps.smoke.outcome }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          title="Alert: production deploy or smoke test failed"
          gh label create alert --color B60205 --description "Production monitor" 2>/dev/null || true
          open="$(gh issue list --label alert --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          case "$DEPLOY_RESULT/$SMOKE" in
            failure/*) problem="The deploy of \`$SHA\` failed: $DEPLOY_URL" ;;
            success/failure) problem="\`$SHA\` deployed, but the smoke test of surveytool.app failed:
          \`\`\`
          $(tail -n 30 smoke.log 2>/dev/null)
          \`\`\`
          Deploy: $DEPLOY_URL" ;;
            success/success) problem="" ;;
            *) echo "Deploy $DEPLOY_RESULT; nothing to report."; exit 0 ;;
          esac
          if [ -n "$problem" ]; then
            body="$(printf '%s\n\nWhat to do: docs/ROLLBACK.md' "$problem")"
            if [ -n "$open" ]; then gh issue comment "$open" --body "$body"
            else gh issue create --title "$title" --label alert --body "$body"; fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "\`$SHA\` deployed and passed the smoke test."
          fi

      # One comment per new live commit on a single "Production release notes"
      # issue: the merged PRs since the last commit noted there. The last
      # comment ends with a marker holding that commit.
      - name: Post release notes
        if: github.event.workflow_run.conclusion == 'success' && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          live="$(curl --silent "https://surveytool.app/release.json?t=$(date +%s)" | jq -r '.commit // empty' || true)"
          [ -n "$live" ] || { echo "No live commit."; exit 0; }
          git fetch --quiet origin main || true
          git cat-file -e "$live^{commit}" 2>/dev/null || { echo "Live commit $live is not in history."; exit 0; }
          title="Production release notes"
          gh label create release-notes --color 0E8A16 --description "What went live on surveytool.app" 2>/dev/null || true
          issue="$(gh issue list --label release-notes --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          prev=""
          if [ -n "$issue" ]; then
            prev="$(gh issue view "$issue" --json body,comments --jq '.body, .comments[].body' \
              | grep -o 'release-notes-commit: [0-9a-f]\{40\}' | tail -n 1 | cut -d' ' -f2)"
          fi
          [ "$prev" = "$live" ] && { echo "Already noted $live."; exit 0; }
          if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" "$live" 2>/dev/null; then
            range="$prev..$live"
          else
            range="$live~1..$live"
          fi
          lines="$(git log --first-parent --format='- %s' "$range" | head -n 60)"
          body="$(printf '**Live on surveytool.app since %s** (`%s`)\n\n%s\n\n<!-- release-notes-commit: %s -->' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "${live:0:7}" "$lines" "$live")"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"
          else gh issue create --title "$title" --label release-notes --body "$body"; fi
