name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` rather than `npm ci` so each platform picks up its
        # own optional dependencies (notably @rollup/rollup-<platform>-<arch>).
        # npm has a long-standing bug where `ci` skips optional deps not
        # resolved on the machine that generated the lock file — see
        # https://github.com/npm/cli/issues/4828. Using install sidesteps it.
        run: npm install --include=optional --no-audit --no-fund

      - name: Build web bundle
        # The web bundle is large (App.jsx alone is ~1.3MB) and can exceed
        # Node's default 1.5GB heap during vite/rollup transform. Give it
        # 8GB to match local macOS behavior. VITE_ env vars come from
        # repo secrets so Supabase + Syncfusion license are baked into
        # every packaged build.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SYNCFUSION_LICENSE_KEY: ${{ secrets.VITE_SYNCFUSION_LICENSE_KEY }}
          # SECURITY 2026-05-28: VITE_GITHUB_LOG_TOKEN removed. Baking a GitHub
          # write-token into the renderer leaked it byte-for-byte in every
          # shipped build (and IsaiahCalvo/Survey is public). Save Log now
          # relies on the `gh` CLI on desktop and the OS share sheet on
          # mobile/browser. If GitHub upload must be restored, do it via a
          # server-side path (e.g. a Supabase Edge Function under RLS) — never
          # a baked client token. See audit/deep-dive-today/REPORT.md (risk #1).
        run: npm run build

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
