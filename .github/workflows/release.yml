name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Use `npm install` rather than `npm ci` so each platform picks up its
        # own optional dependencies (notably @rollup/rollup-<platform>-<arch>).
        # npm has a long-standing bug where `ci` skips optional deps not
        # resolved on the machine that generated the lock file — see
        # https://github.com/npm/cli/issues/4828. Using install sidesteps it.
        run: npm install --include=optional --no-audit --no-fund

      - name: Build web bundle
        run: npm run build

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish always
