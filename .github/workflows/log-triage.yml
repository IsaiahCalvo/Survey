name: Device log triage

# 2026-09-15 — This opened one GitHub Issue per uploaded log, and uploads come
# in bursts: 100 issues between 2026-06-02 and 2026-06-26, twenty of them on a
# single day, 34 still open. Each one emailed the owner. It now files the first
# log of a given kind as an Issue and hangs every repeat of that same kind
# underneath it as a comment, so a debugging session becomes one thread to read
# instead of twenty inboxes to clear. Nothing is dropped — every log still gets
# filed, with its own permalink, under the matching heading.

on:
  push:
    branches:
      - logs

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    name: File the new device log
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Open triage Issue for new log
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commit = await github.rest.repos.getCommit({
              owner, repo, ref: context.sha
            });
            // Take the first log file added/modified in this commit.
            const logFile = (commit.data.files || [])
              .filter(f => f.filename.endsWith('.log'))
              .map(f => f.filename)[0];
            if (!logFile) {
              core.info('No .log file in this commit — skipping issue creation.');
              return;
            }
            // Pull the first ~400 lines of the file for the issue body; full
            // log is always accessible via the permalink.
            const fileRes = await github.rest.repos.getContent({
              owner, repo, path: logFile, ref: context.sha
            });
            const content = Buffer
              .from(fileRes.data.content, 'base64')
              .toString('utf-8');
            const lines = content.split('\n');
            // GitHub Issues cap bodies at 65536 chars. Leave ~5k for headers,
            // leaving ~60k for the log preview. Cap both by line count AND
            // by byte budget so long single lines can't blow past the limit.
            const MAX_PREVIEW_CHARS = 60000;
            let preview = lines.slice(0, 400).join('\n');
            if (preview.length > MAX_PREVIEW_CHARS) {
              preview = preview.slice(0, MAX_PREVIEW_CHARS) + '\n… (truncated)';
            }
            const truncated = lines.length > 400 || content.length > preview.length;

            // Device tag from filename: "mac-host-ts.log", "windows-host-ts.log", etc.
            const m = logFile.match(/^(mac|windows|linux|ios|android)-([^-]+)-/);
            const platform = m ? m[1] : 'unknown';
            const host = m ? m[2] : 'unknown';

            // Error signature — grab the first error-ish line for the title.
            const errorLine = lines.find(l =>
              /error|fail|cannot|unable|typeerror|referenceerror|exception/i.test(l)
            ) || '(no obvious error line)';
            const shortError = errorLine.slice(0, 120);

            const title = `[${platform}] Device log triage — ${shortError}`;
            const body = [
              `**Platform:** ${platform}`,
              `**Host:** ${host}`,
              `**Log file:** [${logFile}](https://github.com/${owner}/${repo}/blob/logs/${logFile})`,
              `**Commit:** ${context.sha.slice(0,7)}`,
              '',
              '### First error line',
              '```',
              errorLine,
              '```',
              '',
              '### Log preview' + (truncated ? ' (first 400 lines)' : ''),
              '```',
              preview,
              '```'
            ].join('\n');

            // Fold repeats into one thread. Logs uploaded during a single
            // debugging session share an error signature, so they share a title;
            // filing the second and later ones as comments on the still-open
            // issue keeps all the evidence together and stops a burst of uploads
            // becoming a burst of separate notifications. Matching is on the
            // exact title of an OPEN device-log issue, so once the owner closes
            // a thread the next log of that kind opens a fresh one.
            const openDeviceLogIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', labels: 'device-log', per_page: 100 }
            );
            const existing = openDeviceLogIssues
              .find(issue => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: existing.number,
                body: [
                  `Another log with the same signature — [${logFile}](https://github.com/${owner}/${repo}/blob/logs/${logFile}) (commit ${context.sha.slice(0,7)}, host ${host}).`,
                  '',
                  '### Log preview' + (truncated ? ' (first 400 lines)' : ''),
                  '```',
                  preview,
                  '```'
                ].join('\n')
              });
              core.info(`Added ${logFile} to existing triage issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner, repo,
              title,
              body,
              labels: ['device-log', `platform:${platform}`]
            });
            core.info(`Opened triage issue #${created.data.number} for ${logFile}`);
