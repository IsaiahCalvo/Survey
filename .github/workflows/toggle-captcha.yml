name: Toggle auth CAPTCHA

# Temporarily disable (and re-enable) Supabase Auth's Turnstile CAPTCHA so
# automated production smoke tests can create a test session. Owner-authorized
# 2026-08-18. Always re-enable after the test window.

on:
  workflow_dispatch:
    inputs:
      state:
        description: "enable or disable"
        required: true
        type: choice
        options:
          - enable
          - disable

permissions: {}

concurrency:
  group: captcha-toggle
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Patch security_captcha_enabled
        shell: bash
        run: |
          case "${{ github.event.inputs.state }}" in
            enable)  enabled=true ;;
            disable) enabled=false ;;
            *) echo "invalid state input" >&2; exit 1 ;;
          esac
          # Response body may echo auth config including secrets — never print it.
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X PATCH "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"security_captcha_enabled\": ${enabled}}")
          echo "PATCH config/auth -> HTTP ${code} (captcha ${enabled})"
          test "${code}" = "200"
