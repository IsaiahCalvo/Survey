# Signed-in walk through the real Android app against the throwaway local
# Supabase (docs/E2E-SIGNED-IN.md): sign in as the seeded owner, open the
# sample drawing, export it and check the share sheet opens.
appId: com.kalvoe.survey
name: android-signed-in
---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
- tapOn:
    text: "Wait"
    optional: true
- takeScreenshot: 01-sign-in
- tapOn:
    id: "email"
- inputText: "e2e-owner@example.com"
- tapOn:
    id: "password"
- inputText: "E2e-local-only-123!"
- hideKeyboard
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: ".*E2E Sample Drawing.*"
    timeout: 60000
- takeScreenshot: 02-documents
- tapOn: ".*E2E Sample Drawing.*"
# On a phone, tapping the row opens the document straight away.
- tapOn:
    text: "Open file"
    optional: true
- extendedWaitUntil:
    visible: "More document options"
    timeout: 90000
- takeScreenshot: 03-document-open
# Launch audit 2026-10-30: the iOS walk passed for days while the viewer
# showed "Couldn't open this PDF" (the toolbar loads either way). The page
# itself must draw: no error screen, and the sample PDF's own link (its
# overlay exists only once pdf.js has the page) shows up.
- assertNotVisible: ".*Couldn.t open this PDF.*"
- extendedWaitUntil:
    visible: ".*Open link https://claude.com.*"
    timeout: 60000
- tapOn: "More document options"
- takeScreenshot: 04-more-menu
- tapOn: "Export annotated PDF"
# Android's share sheet (the system chooser) lists apps and a "Share" title.
- extendedWaitUntil:
    visible: ".*(Share|share|Copy|Nearby|Drive).*"
    timeout: 30000
- takeScreenshot: 05-share-sheet
# #1006: the phone top bar's Export button goes to the same share sheet.
- pressKey: Back
- extendedWaitUntil:
    visible: "Export"
    timeout: 30000
- tapOn: "Export"
- extendedWaitUntil:
    visible: ".*(Share|share|Copy|Nearby|Drive).*"
    timeout: 30000
- takeScreenshot: 06-share-sheet-top-bar
- pressKey: Back
- extendedWaitUntil:
    visible: "More document options"
    timeout: 30000
# Phone walk 2026-10-28: the phone's bottom panels open and close, and Survey's
# "Export data" Excel file reaches the share sheet (the native download shim)
# like the PDF does. Each panel button toggles its sheet. Export is off while a
# survey has no items, so the export runs on the seeded agent drawing (it has
# E2E Doors items); "Done" (Leave Survey) puts the Survey tool down and the
# flow reopens the sample drawing, so the scripts after it find the plain
# viewer with Pan armed.
- tapOn: "Open spaces"
- extendedWaitUntil:
    visible: "Create space"
    timeout: 30000
- takeScreenshot: 07-spaces-sheet
- tapOn: "Open spaces"
- extendedWaitUntil:
    notVisible: "Create space"
    timeout: 30000
- runFlow: android-open-agent-drawing.yaml
- tapOn: "Open survey"
- tapOn:
    text: "E2E Doors.*"
    optional: true
- extendedWaitUntil:
    visible: "Export data"
    timeout: 30000
- takeScreenshot: 08-survey-sheet
# The share sheet opens over the spot where Export sat; a second "no change
# yet" tap landed on its Bluetooth target.
- tapOn:
    text: "Export data"
    retryTapIfNoChange: false
# On the bare emulator only Bluetooth takes an .xlsx file, and Android opens
# the one app that matches instead of a chooser: that is the file reaching the
# share path too. A phone with Drive, Gmail or Excel shows the chooser.
- extendedWaitUntil:
    visible: ".*(Share|share|Copy|Nearby|Drive|Bluetooth).*"
    timeout: 30000
- takeScreenshot: 09-survey-export-share-sheet
- pressKey: Back
- extendedWaitUntil:
    visible: "Leave Survey"
    timeout: 30000
- tapOn: "Leave Survey"
- extendedWaitUntil:
    notVisible: "Export data"
    timeout: 30000
- tapOn: "Back to documents"
- extendedWaitUntil:
    visible: ".*E2E Sample Drawing.*"
    timeout: 60000
- tapOn: ".*E2E Sample Drawing.*"
- tapOn:
    text: "Open file"
    optional: true
- extendedWaitUntil:
    visible: "More document options"
    timeout: 90000
