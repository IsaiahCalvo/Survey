# Opens the sample drawing (android-pdf-tools-offline.sh runs this first, with
# the local API reconnected, then cuts it).
appId: com.kalvoe.survey
name: android-pdf-tools-offline
---
- tapOn: ".*E2E Sample Drawing.*"
- tapOn:
    text: "Open file"
    optional: true
- extendedWaitUntil:
    visible: "More document options"
    timeout: 90000
- takeScreenshot: 20-offline-document-open
