<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Survey — Download</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --card: #111b2e;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --ring: rgba(59, 130, 246, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 55%, #020617 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid rgba(148, 163, 184, 0.12);
    border-radius: 18px;
    padding: 44px 40px 36px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 32px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 15px;
  }
  .platform-icon {
    font-size: 64px;
    line-height: 1;
    margin-bottom: 14px;
  }
  .platform-label {
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .platform-label strong {
    color: var(--text);
  }
  .download-btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 16px 36px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 24px var(--ring);
    border: 0;
    cursor: pointer;
  }
  .download-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }
  .download-btn:active {
    transform: translateY(0);
  }
  .download-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .version {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-top: 14px;
    font-variant-numeric: tabular-nums;
  }
  .alt-platforms {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid rgba(148, 163, 184, 0.1);
    font-size: 14px;
    color: var(--muted);
  }
  .alt-platforms a {
    color: var(--muted);
    text-decoration: underline;
    margin: 0 8px;
    transition: color 0.15s ease;
  }
  .alt-platforms a:hover {
    color: var(--text);
  }
  .error {
    color: #f87171;
    font-size: 14px;
    margin-top: 12px;
  }
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <main class="card">
    <div id="platformIcon" class="platform-icon">⬇</div>
    <h1>Survey</h1>
    <p class="subtitle">PDF annotation for surveys &amp; construction plans</p>
    <p id="platformLabel" class="platform-label">Detecting your computer…</p>
    <a id="downloadBtn" class="download-btn" href="#" aria-disabled="true">
      <span class="spinner"></span>Loading…
    </a>
    <span id="versionLine" class="version"></span>
    <p id="errorLine" class="error" hidden></p>
    <div class="alt-platforms">
      Or download for
      <a id="linkMac" href="#">Mac</a>·
      <a id="linkWin" href="#">Windows</a>·
      <a href="https://github.com/IsaiahCalvo/Survey/releases/latest" target="_blank" rel="noopener">See all files</a>
    </div>
  </main>

<script>
(function () {
  const REPO = 'IsaiahCalvo/Survey';
  const apiUrl = `https://api.github.com/repos/${REPO}/releases/latest`;

  const ua = navigator.userAgent || '';
  const platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  const isMac = /Mac|Macintosh/i.test(platform) || /Mac OS X/i.test(ua);
  const isWin = /Win/i.test(platform) || /Windows/i.test(ua);
  const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);

  const iconEl = document.getElementById('platformIcon');
  const labelEl = document.getElementById('platformLabel');
  const btnEl = document.getElementById('downloadBtn');
  const versionEl = document.getElementById('versionLine');
  const errorEl = document.getElementById('errorLine');
  const linkMac = document.getElementById('linkMac');
  const linkWin = document.getElementById('linkWin');

  let targetLabel = 'your computer';
  let targetIcon = '💻';
  if (isMac) { targetLabel = 'Mac'; targetIcon = '🍎'; }
  else if (isWin) { targetLabel = 'Windows'; targetIcon = '🪟'; }
  else if (isMobile) { targetLabel = 'Mobile'; targetIcon = '📱'; }

  iconEl.textContent = targetIcon;

  function pickAsset(assets, test) {
    return assets.find(test);
  }

  function bytes(n) {
    if (!n) return '';
    const mb = n / (1024 * 1024);
    return mb >= 100 ? `${Math.round(mb)} MB` : `${mb.toFixed(1)} MB`;
  }

  fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } })
    .then((r) => { if (!r.ok) throw new Error(`Release lookup failed (${r.status})`); return r.json(); })
    .then((release) => {
      const assets = release.assets || [];
      const macAsset = pickAsset(assets, (a) => /\.dmg$/i.test(a.name) && !/blockmap/i.test(a.name));
      const winAsset = pickAsset(assets, (a) => /\.exe$/i.test(a.name) && !/blockmap/i.test(a.name));

      if (macAsset) linkMac.href = macAsset.browser_download_url;
      if (winAsset) linkWin.href = winAsset.browser_download_url;

      let primary = null;
      if (isMac && macAsset) primary = macAsset;
      else if (isWin && winAsset) primary = winAsset;
      else if (macAsset) primary = macAsset;
      else if (winAsset) primary = winAsset;

      versionEl.textContent = release.tag_name ? `Version ${release.tag_name.replace(/^v/, '')}` : '';

      if (isMobile) {
        labelEl.innerHTML = `Mobile support is <strong>coming soon</strong>. The desktop app is available now.`;
        if (primary) {
          btnEl.textContent = `Download for ${primary.name.toLowerCase().includes('.dmg') ? 'Mac' : 'Windows'}`;
          btnEl.href = primary.browser_download_url;
          btnEl.removeAttribute('aria-disabled');
        }
        return;
      }

      if (!primary) {
        labelEl.textContent = 'No installers in the latest release yet.';
        btnEl.textContent = 'See all releases';
        btnEl.href = `https://github.com/${REPO}/releases/latest`;
        btnEl.removeAttribute('aria-disabled');
        return;
      }

      labelEl.innerHTML = `Detected <strong>${targetLabel}</strong> — here's the right installer.`;
      const sizeText = bytes(primary.size);
      btnEl.textContent = `Download for ${targetLabel}${sizeText ? ` (${sizeText})` : ''}`;
      btnEl.href = primary.browser_download_url;
      btnEl.removeAttribute('aria-disabled');
    })
    .catch((err) => {
      labelEl.textContent = 'Could not reach GitHub to find the latest installer.';
      errorEl.textContent = err.message || String(err);
      errorEl.hidden = false;
      btnEl.textContent = 'See all releases';
      btnEl.href = `https://github.com/${REPO}/releases/latest`;
      btnEl.removeAttribute('aria-disabled');
      linkMac.href = `https://github.com/${REPO}/releases/latest`;
      linkWin.href = `https://github.com/${REPO}/releases/latest`;
    });
})();
</script>
</body>
</html>
