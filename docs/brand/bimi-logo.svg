<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 512 512">
  <title>Survey</title>
  <!-- Email sender avatar. SVG Tiny PS: no scripts, no external refs, no raster,
       solid background required. This is the one file allowed to carry a plate.
