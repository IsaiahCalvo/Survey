<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.2" baseProfile="tiny-ps" viewBox="0 0 512 512">
  <title>Survey</title>
  <!-- BIMI avatar: the Survey mark (crosshair ring + three survey lines),
       rebuilt as pure vectors from public/logo512.png. SVG Tiny PS rules:
       no scripts, no external refs, no raster. Solid background required. -->
  <rect x="0" y="0" width="512" height="512" fill="#ffffff"/>
  <g fill="none" stroke="#0b0b0b" stroke-width="40" stroke-linecap="round">
    <circle cx="256" cy="256" r="186"/>
    <line x1="256" y1="88" x2="256" y2="126"/>
    <line x1="256" y1="386" x2="256" y2="424"/>
    <line x1="88" y1="256" x2="126" y2="256"/>
    <line x1="386" y1="256" x2="424" y2="256"/>
  </g>
  <g fill="none" stroke="#0b0b0b" stroke-width="36" stroke-linecap="round">
    <line x1="196" y1="176" x2="322" y2="176"/>
    <line x1="196" y1="256" x2="322" y2="256"/>
    <line x1="196" y1="336" x2="252" y2="336"/>
  </g>
</svg>
