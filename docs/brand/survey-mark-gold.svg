  <circle cx="256" cy="256" r="216"/>
  <line x1="256" y1="44" x2="256" y2="100"/>
  <line x1="256" y1="468" x2="256" y2="412"/>
  <line x1="44" y1="256" x2="100" y2="256"/>
  <line x1="468" y1="256" x2="412" y2="256"/>
  <line x1="196" y1="204" x2="316" y2="204"/>
  <line x1="196" y1="308" x2="268" y2="308"/>
  </g>
</svg>
