<!--
  Counter tool glyph. 2026-09-07 polish pass: redrawn on the house 24-unit grid.

  Why: the supplied artwork was a hand-sketched ring on a 976-unit viewBox — it
  was not round (the top-left ran nearly square while the bottom-right bulged),
  its ink filled 98% of its box so it rendered 20x20 in a 20px slot against the
  Ellipse's 18x18 beside it, and its "1" sat right of the ring centre and high.
  Next to four crisp geometric shapes it read as a different hand.

  Now: a true circle at exactly the Ellipse glyph's geometry — cx/cy 12, r 10,
  stroke 1.5 — so the two read as siblings and the ring picks up the row's
  ~5% optical margin instead of touching its box.

  2026-09-16 (desktop sweep): the "1" is drawn at the ring's 1.5, not its own
  2.0. It was 2.0 on the optical-sizing argument (a small form needs relatively
  heavier strokes to read at the same weight), and that argument is real — but
  the owner's ruling for this pass overrides it: ONE stroke weight across the
  whole set, no per-form compensation, and no exemption for an asset just because
  nothing imports it yet. One weight is what the set is judged on.

  Its horizontal placement splits the difference between the two things that
  could be called "centred": centring the stem alone leaves the flag hanging
  left and the whole numeral reads left of the ring, while centring the ink
  bbox pushes the stem visibly right (the eye reads a "1" by its stem). Stem at
  12.7 with the flag to 10.7 puts the ink bbox centre at 11.7 and the stem 0.7
  right of the ring centre, which is what actually looks centred.

  Selected state: this renders as a mask, so the whole glyph takes the active
  colour — gold ring plus gold numeral, never a solid gold disc. Keep it a ring
  with a hollow centre (owner rule).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#000" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="10" stroke-width="1.5"/>
  <path d="M10.7 9.5 12.7 7.6V16.4" stroke-width="1.5"/>
</svg>
