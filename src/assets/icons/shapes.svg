<!--
  Shapes group glyph. 2026-09-07 polish pass: redrawn from the supplied filled
  artwork as stroke-based work on the house 24-unit grid.

  Why: the filled version painted ~2x the ink of its top-toolbar neighbours
  (109.7 px2 vs Draw 48.8 / Text 54.2, measured at 1x), it touched all four
  edges of its box (100% fill, zero optical margin, so it read bigger AND
  heavier than everything beside it), and it carried two different line weights
  inside itself — 2.0-unit rings on the circle and square against ~1.6 on the
  triangle's diagonals.

  Now: one stroke weight, 1.7 units; at 18px this paints 1.28px, close to
  Pan’s 1.5 units at 20px (1.25px). Artwork inset to a ~1.7-unit optical margin (ink
  envelope 20.6/24 = 86%): a composite of three small forms carries more
  internal white space than a single glyph, so it may run slightly larger than
  the 83% single-form reference (the owner's text-box icon) without reading
  bigger. Sub-form sizing follows the overshoot rule — the circle's outer
  diameter (9.78) is ~3% larger than the square's (9.5) so the two look the same
  size, and the triangle is widest of the three (11.0) because a pointed form
  reads smallest of all. Composition (circle top-left, square right, triangle
  bottom) is the owner's, unchanged.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#000" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="6.7" cy="6.7" r="4.16"/>
  <rect x="13.55" y="4.75" width="7.9" height="7.9" rx="1"/>
  <path d="M11 14.2 15.75 21.45 6.25 21.45Z"/>
</svg>
