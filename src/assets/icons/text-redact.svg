<!--
  Redact glyph for the text-markup sub-toolbar. 2026-09-07 polish pass.

  Why: it was the odd one out in a row of six. It rendered at size 21 while
  every other glyph in the row renders at 18, so it was the widest thing there,
  and its redaction bar was a 3-of-28-unit slab — 2.25px against ~1.5px
  strokes — which is what made it read about half again as heavy as its
  neighbours.

  Now: the house 24-unit grid, the house 1.5-unit stroke weight, ink envelope
  18.5 x 19.7 of 24 centred on its own ink, and the size override in
  TextSelectionActionBar.jsx removed so it renders at 18 with the rest. It
  lands at 14x15px in an 18px box, inside the row's 12-17px band.

  2026-09-16 (desktop sweep): the letter strokes are 1.5, down from 1.75. The
  1.75 was tuned against a row that then ran 1.42-1.78; hyperlink has since come
  down to 1.5 too, so 1.75 became the one heavy glyph left. Owner ruling of this
  pass: ONE stroke weight across the set, and "the asset is sha256-pinned" is no
  longer a reason to stay off it — the pins in
  tests/textSelectionActionBarMounted.test.mjs and tests/redactIconSource.test.mjs
  were re-taken for this weight. The solid bar below is UNCHANGED (see 1 below):
  it is the mark, not an outline stroke, and its weight is the glyph's meaning.

  Two judgement calls worth knowing about, both reversible in one line:

  1. The redaction bar stays SOLID and stays heavier than the strokes (3.6
     units, 2.7px). A pass that slimmed it to the row's stroke weight killed
     the meaning outright — it just read as the letter A. A blacked-out bar is
     the identity of this mark, so the weight came out of the strokes and the
     overall size instead.

  2. The old artwork was TWO glyphs, an "A" plus a serif I-beam, and that is
     why it was the widest thing in the row and why it read as the word "AI"
     once the bar was slimmed. Every other mark in this row is one letter
     carrying one mark — U with a rule, U with a squiggle, S with a rule, T in
     a marker. Redact is now the same shape of idea: one letter under one bar.
     If the I-beam is wanted back, it belongs at a smaller size to the right,
     but the glyph will go wide again.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M3.6 21.1 12 2.9 20.4 21.1"/>
  <rect x="2.75" y="13.4" width="18.5" height="3.6" fill="#000" stroke="none"/>
</svg>
