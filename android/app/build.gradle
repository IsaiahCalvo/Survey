apply plugin: 'com.android.application'

// Release signing: env vars (CI) override android/keystore.properties (local,
// git-ignored). Keys: storeFile (relative to android/), storePassword, keyAlias,
// keyPassword. Env: SURVEY_UPLOAD_STORE_FILE, SURVEY_UPLOAD_STORE_PASSWORD,
// SURVEY_UPLOAD_KEY_ALIAS, SURVEY_UPLOAD_KEY_PASSWORD. With none set, release
// builds stay unsigned (as before).
def releaseSigning = [:]
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    def props = new Properties()
    keystorePropsFile.withInputStream { props.load(it) }
    props.each { k, v -> releaseSigning[k] = v }
}
['storeFile': 'SURVEY_UPLOAD_STORE_FILE', 'storePassword': 'SURVEY_UPLOAD_STORE_PASSWORD',
 'keyAlias': 'SURVEY_UPLOAD_KEY_ALIAS', 'keyPassword': 'SURVEY_UPLOAD_KEY_PASSWORD'].each { k, envName ->
    def v = System.getenv(envName)
    if (v) releaseSigning[k] = v
}
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseSigning[it] }

android {
    namespace = "com.kalvoe.survey"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kalvoe.survey"
        // CI Nightly build: own app id so it installs next to the stable app.
        if (project.hasProperty("surveyNightly")) {
            applicationIdSuffix ".nightly"
        }
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode/versionName are set by `npm run native:version` from package.json.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    // flatDir block removed 2026-04-22 — newer Android Gradle Plugin warns
    // against flatDir, and the referenced folders don't exist in this
    // project (no Cordova plugin jars, no app/libs). Re-add only if a
    // future plugin actually needs a local jar dropped in.
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
