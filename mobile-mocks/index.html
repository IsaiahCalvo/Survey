<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Survey Mobile Mock Launcher</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111214;
        --panel: #1c1d21;
        --text: #f4f4f5;
        --muted: #aaaeb7;
        --blue: #55a6ff;
        --line: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter,
          Segoe UI, sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(100%, 420px);
        padding: 22px;
        border-radius: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .qr {
        display: grid;
        place-items: center;
        padding: 16px;
        border-radius: 14px;
        background: #fff;
        margin-bottom: 16px;
      }

      .qr img {
        width: min(100%, 260px);
        aspect-ratio: 1;
        display: block;
      }

      a {
        color: inherit;
      }

      .button {
        width: 100%;
        height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: var(--blue);
        color: #07111d;
        text-decoration: none;
        font-size: 15px;
        font-weight: 750;
      }

      code {
        display: block;
        margin-top: 14px;
        padding: 12px;
        border-radius: 10px;
        overflow-wrap: anywhere;
        background: #101114;
        color: #cfd3db;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Survey iPhone Prototype</h1>
      <p>Scan from your phone on Tailscale. This version is interactive.</p>
      <div class="qr">
        <img
          alt="QR code for phone prototype"
          src="https://quickchart.io/qr?size=260&margin=1&text=http%3A%2F%2F100.113.236.18%3A50134%2Finteractive-field-prototype.html"
        />
      </div>
      <a class="button" href="/interactive-field-prototype.html">Open prototype</a>
      <code>http://100.113.236.18:50134/interactive-field-prototype.html</code>
    </main>
  </body>
</html>
